<style>
/* Layout: barra con selectores de versión e idioma, franja de KPIs, tres gráficos con tooltip, panel de integridad */
:root{
  --bg:#F1F3F4; --surface:#FFFFFF; --s2:#F1F3F4; --s3:#E8EAED;
  --ink:#202124; --ink2:#5F6368; --ink3:#80868B;
  --line:#DADCE0; --line2:#BDC1C6;
  --acc:#1A73E8; --accbg:#E8F0FE;
  --crit:#D93025; --critbg:#FCE8E6;
  --warn:#E37400; --warnbg:#FEF7E0;
  --ok:#1E8E3E; --okbg:#E6F4EA;
  --grid:#E8EAED;
  --sh:0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
  --sh2:0 1px 3px 0 rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
  --fs:"Roboto","Helvetica Neue",Arial,sans-serif;
  --fm:"Roboto Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#202124; --surface:#292A2D; --s2:#35363A; --s3:#3C4043;
  --ink:#E8EAED; --ink2:#9AA0A6; --ink3:#80868B;
  --line:#3C4043; --line2:#5F6368;
  --acc:#8AB4F8; --accbg:#1F3047;
  --crit:#F28B82; --critbg:#3B2220;
  --warn:#FDD663; --warnbg:#3A2F15;
  --ok:#81C995; --okbg:#1C2E22;
  --grid:#35363A;
  --sh:0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
  --sh2:0 1px 3px 0 rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#202124; --surface:#292A2D; --s2:#35363A; --s3:#3C4043;
  --ink:#E8EAED; --ink2:#9AA0A6; --ink3:#80868B;
  --line:#3C4043; --line2:#5F6368;
  --acc:#8AB4F8; --accbg:#1F3047;
  --crit:#F28B82; --critbg:#3B2220;
  --warn:#FDD663; --warnbg:#3A2F15;
  --ok:#81C995; --okbg:#1C2E22;
  --grid:#35363A;
  --sh:0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
  --sh2:0 1px 3px 0 rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);font-size:13px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;
  -webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased;user-select:none}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:14px 32px}
h1,h2,h3{margin:0;font-weight:500}

.bar{background:var(--surface);border-radius:12px;box-shadow:var(--sh);padding:12px 16px;
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:12px}
.bar h1{font-size:16px;display:flex;align-items:center;gap:9px}
.bar h1 .ms{font-size:21px;color:var(--acc)}
.bar .job{font-family:var(--fm);font-size:11.5px;color:var(--ink3);padding-left:2px}
.ctl{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fld{display:flex;align-items:center;gap:8px}
.fld label{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
select{font-family:var(--fs);font-size:13px;font-weight:500;color:var(--ink);background:var(--surface);
  border:1px solid var(--line2);border-radius:8px;padding:7px 11px;cursor:pointer}
#sel{min-width:186px}
select:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.meta{font-family:var(--fm);font-size:11.5px;color:var(--ink2)}
.meta b{color:var(--ink);font-weight:500}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:1040px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.k{background:var(--surface);border-radius:12px;box-shadow:var(--sh);padding:11px 13px 12px;min-width:0;
  border-top:3px solid transparent}
.k.c{border-top-color:var(--crit)} .k.w{border-top-color:var(--warn)} .k.o{border-top-color:var(--ok)}
.k .lb{font-size:10.5px;color:var(--ink2);font-weight:500;text-transform:uppercase;letter-spacing:.05em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .v{font-family:var(--fm);font-size:24px;font-weight:500;line-height:1.1;margin-top:5px}
.k.c .v{color:var(--crit)} .k.w .v{color:var(--warn)} .k.o .v{color:var(--ok)}
.k .s{font-size:11px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .d{font-family:var(--fm);font-size:11px;margin-top:4px;display:flex;align-items:center;gap:3px}
.k .d .ms{font-size:14px}
.dn{color:var(--crit)} .up{color:var(--ok)} .fl{color:var(--ink3)}

.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--sh);padding:13px 15px 12px;min-width:0;position:relative}
.card h3{font-size:13px;margin-bottom:2px;padding-right:34px}
.card .nt{font-size:11.5px;color:var(--ink3);margin:0 0 9px}
.card .rd{font-size:11.5px;color:var(--ink2);margin:9px 0 0;padding-top:9px;border-top:1px solid var(--line);line-height:1.5}
.card .rd b{color:var(--ink);font-weight:500}
.exp{position:absolute;top:9px;right:10px;width:28px;height:28px;border-radius:50%;border:none;padding:0;
  background:transparent;color:var(--ink3);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s}
.exp:hover{background:var(--s2);color:var(--ink)}
.exp:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.exp .ms{font-size:17px}
.card.big{grid-column:1/-1}
.lg{display:flex;flex-wrap:wrap;gap:4px 13px;font-size:11px;color:var(--ink2);margin-bottom:6px}
.lg span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:3px;border-radius:2px;flex:none}
.sw.q{width:9px;height:9px;border-radius:2px}
.plot{position:relative}
svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);
  border-radius:6px;padding:6px 9px;font-size:11.5px;line-height:1.5;white-space:nowrap;
  box-shadow:var(--sh2);opacity:0;transition:opacity .12s;z-index:5;font-family:var(--fm)}
.tip.on{opacity:1}
.tip .th{font-family:var(--fs);font-weight:500;font-size:11px;opacity:.72;margin-bottom:2px}
.tip i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);padding:0 7px 6px 0;border-bottom:1px solid var(--line)}
th.n,td.n{text-align:right;padding-right:0}
td{padding:7px 7px 7px 0;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.mo{font-family:var(--fm);font-size:11.5px}
.nm{font-family:var(--fm);font-weight:500}
.nm.hot{color:var(--crit)}
.pill{display:inline-block;font-family:var(--fm);font-size:10.5px;font-weight:500;
  padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.c{background:var(--critbg);color:var(--crit)}
.pill.w{background:var(--warnbg);color:var(--warn)}
.pill.o{background:var(--okbg);color:var(--ok)}
.note{margin:10px 0 0;padding:10px 12px;background:var(--s2);border-radius:8px;
  font-size:11.5px;color:var(--ink2);line-height:1.55}
.note.c{background:var(--critbg);color:var(--crit)}
.note.w{background:var(--warnbg);color:var(--warn)}
.note b{font-weight:500}
.note code{font-family:var(--fm);font-size:11px;background:rgba(128,134,139,.2);padding:1px 5px;border-radius:4px}
.sub{font-size:11px;color:var(--ink3);line-height:1.5;margin-top:2px}
footer{margin-top:14px;padding:12px 15px;background:var(--surface);border-radius:12px;box-shadow:var(--sh);
  font-size:11px;color:var(--ink3);line-height:1.6}
footer code{font-family:var(--fm);font-size:10.5px;background:var(--s2);padding:1px 4px;border-radius:3px}
</style>

  hook(s,document.getElementById('t1'),lab.length,X,function(i){
    return '<div class="th">'+D[i].id+' · '+fd(D[i].dd)+'</div>'+
      '<i style="background:'+C.ms2+'"></i>'+L().ms2.split('·')[0].trim()+'  '+fmt(g2[i],' d')+'<br>'+
      '<i style="background:'+C.ms3+'"></i>'+L().ms3.split('·')[0].trim()+'  '+fmt(g3[i],' d')+'<br>'+
      '<i style="background:'+C.tco+'"></i>'+L().lgTco+'  '+fmt(gt[i],' d')},d);
}

function chart2(idx){
  var d=dm('c2'),W=d.W,H=d.H,Lm=d.L,T=d.T,iw=d.iw,ih=d.ih;
  var o=D[idx],s=clear('c2');s.setAttribute('viewBox','0 0 '+W+' '+H);
  var real=o.real,plan=o.plan,rl=o.realLab,pl=o.planLab;
  var all=real.concat(plan),n=all.length;
  var hi=Math.max(10,Math.ceil(Math.max.apply(null,all.concat([10]))/50)*50);
  var gap=iw/Math.max(n,1),bw=gap*0.74;
  function Y(v){return T+ih*(1-v/hi)} function X(i){return Lm+gap*i+gap/2}
  [hi,hi*0.75,hi*0.5,hi*0.25,0].forEach(function(v){
    s.appendChild(E('line',{x1:Lm,y1:Y(v),x2:Lm+iw,y2:Y(v),stroke:v===0?cs('--line2'):cs('--grid'),'stroke-width':v===0?1.2:1}));
    s.appendChild(txt(Lm-6,Y(v)+3.2,Math.round(v),{an:'end',mono:1,sz:d.big?11:9.5}))});
  all.forEach(function(v,i){
    s.appendChild(E('rect',{x:(Lm+gap*i+(gap-bw)/2).toFixed(1),y:Y(v).toFixed(1),width:Math.max(1.2,bw).toFixed(1),
      height:Math.max(1,ih-(Y(v)-T)).toFixed(1),fill:i<real.length?C.real:C.plan,rx:1.5}))});
  if(real.length&&plan.length){var xs=Lm+gap*real.length;
    s.appendChild(E('line',{x1:xs,y1:T,x2:xs,y2:T+ih,stroke:cs('--line2'),'stroke-width':1,'stroke-dasharray':'3 3'}))}
  if(d.big)all.forEach(function(v,i){
    s.appendChild(txt(X(i),H-20,fm(i<real.length?rl[i]:pl[i-real.length]),{mono:1,sz:9.5}));
    s.appendChild(txt(X(i),Y(v)-5,v,{mono:1,sz:9.5,fill:cs('--ink2')}))});
  if(real.length)s.appendChild(txt(Lm+gap*real.length/2,H-(d.big?6:9),L().real,{sz:d.big?11:9.5}));
  if(plan.length)s.appendChild(txt(Lm+gap*(real.length+plan.length/2),H-(d.big?6:9),L().plan,{sz:d.big?11:9.5}));
  hook(s,document.getElementById('t2'),n,X,function(i){
    var isR=i<real.length;
    return '<div class="th">'+fm(isR?rl[i]:pl[i-real.length])+'</div>'+
      '<i style="background:'+(isR?C.real:C.plan)+'"></i>'+(isR?L().tReal:L().tPlan)+'  '+all[i]},d);
}

function chart3(idx){
  var d=dm('c3'),W=d.W,H=d.H,Lm=d.L,T=d.T,iw=d.iw,ih=d.ih;
  var s=clear('c3');s.setAttribute('viewBox','0 0 '+W+' '+H);
  var pts=[],lab=[];
  for(var i=1;i<=idx;i++){if(D[i].ppc!==null&&D[i].ppc!==undefined){pts.push(D[i].ppc);lab.push(D[i])}}
  if(!pts.length){s.appendChild(txt(W/2,H/2,L().sinPer,{sz:11}));document.getElementById('r3').textContent='';return}
  var hi=Math.max(70,Math.ceil(Math.max.apply(null,pts)/10)*10);
  var n=pts.length,gap=iw/n,bw=gap*0.6;
  function Y(v){return T+ih*(1-v/hi)} function X(i){return Lm+gap*i+gap/2}
  [hi,hi*0.66,hi*0.33,0].forEach(function(v){
    s.appendChild(E('line',{x1:Lm,y1:Y(v),x2:Lm+iw,y2:Y(v),stroke:v===0?cs('--line2'):cs('--grid'),'stroke-width':v===0?1.2:1}));
    s.appendChild(txt(Lm-6,Y(v)+3.2,Math.round(v)+'%',{an:'end',mono:1,sz:d.big?11:9.5}))});
  var avg=pts.reduce(function(a,b){return a+b},0)/n;
  pts.forEach(function(v,i){
    s.appendChild(E('rect',{x:(Lm+gap*i+(gap-bw)/2).toFixed(1),y:Y(v).toFixed(1),width:bw.toFixed(1),
      height:Math.max(1,ih-(Y(v)-T)).toFixed(1),fill:i===n-1?C.plan:C.real,rx:1.5}))});
  s.appendChild(E('line',{x1:Lm,y1:Y(avg),x2:Lm+iw,y2:Y(avg),stroke:cs('--ink3'),'stroke-width':1.2,'stroke-dasharray':'4 3'}));
  lab.forEach(function(o,i){
    s.appendChild(txt(X(i),H-(d.big?13:9),d.big?fd(o.dd):o.id.replace('U',''),{mono:1,sz:d.big?10:9}));
    if(d.big)s.appendChild(txt(X(i),Y(pts[i])-6,pts[i].toFixed(0)+'%',{mono:1,sz:10,fill:cs('--ink2')}))});
  hook(s,document.getElementById('t3'),n,X,function(i){
    return '<div class="th">'+lab[i].id+' · '+fd(lab[i].dd)+'</div>'+
      '<i style="background:'+(i===n-1?C.plan:C.real)+'"></i>'+pts[i].toFixed(1)+'%  ('+
      L().deComp(lab[i].cump,lab[i].prom)+')'},d);
  document.getElementById('r3').innerHTML=L().r3(avg.toFixed(1),Math.max.apply(null,pts).toFixed(1));
}

function render(){
  var idx=+sel.value,o=D[idx],prev=idx>0?D[idx-1]:null,t=L();
  document.getElementById('job').textContent=t.job;
  document.getElementById('lsel').textContent=t.lsel;
  document.getElementById('llang').textContent=t.llang;
  document.getElementById('meta').innerHTML=t.meta({dd:fd(o.dd,1),a:N(o.nAct),r:N(o.nRel)});
  ['h1','h2','h3','h4','h5','h6'].forEach(function(k){document.getElementById(k).textContent=t[k]});
  ['n1','n2','n3','n4','n5','n6'].forEach(function(k){document.getElementById(k).textContent=t[k]});
  document.getElementById('foot').innerHTML=t.foot;
  document.getElementById('lg1').innerHTML=
    '<span><i class="sw" style="background:'+C.ms2+'"></i>'+t.ms2.split('·')[0].trim()+'</span>'+
    '<span><i class="sw" style="background:'+C.ms3+'"></i>'+t.ms3.split('·')[0].trim()+'</span>'+
    '<span><i class="sw" style="background:'+C.tco+'"></i>'+t.lgTco+'</span>';
  document.getElementById('lg2').innerHTML=
    '<span><i class="sw q" style="background:'+C.real+'"></i>'+t.lgReal+'</span>'+
    '<span><i class="sw q" style="background:'+C.plan+'"></i>'+t.lgPlan+'</span>';
  document.getElementById('lg3').innerHTML=
    '<span><i class="sw q" style="background:'+C.real+'"></i>'+t.lgPpc+'</span>'+
    '<span><i class="sw" style="background:'+cs('--ink3')+'"></i>'+t.lgAvg+'</span>';

  var ks=[];
  [0,1,2,3].forEach(function(j){
    var m=o.ms[j],p=prev?prev.ms[j]:null;
    var dl=(p&&p.tf!==null&&m.tf!==null)?+(m.tf-p.tf).toFixed(2):null;
    ks.push({cl:kl(m.tf),lb:t[m.k],v:fmt(m.tf,' d'),s:t.fc+fd(m.fc),dl:dl})});
  ks.push({cl:o.ppc===null?'':(o.ppc<45?'c':(o.ppc<60?'w':'o')),lb:t.ppc,
    v:o.ppc===null?'—':o.ppc+'%',s:o.ppc===null?t.sinPrev:t.deComp(o.cump,o.prom),
    dl:(prev&&prev.ppc!==null&&o.ppc!==null)?+(o.ppc-prev.ppc).toFixed(1):null});
  document.getElementById('kpis').innerHTML=ks.map(function(x){
    var dd='';
    if(x.dl!==null&&x.dl!==undefined&&x.dl!==0){
      dd='<div class="d '+(x.dl>0?'up':'dn')+'"><span class="ms">'+(x.dl>0?'arrow_upward':'arrow_downward')+
        '</span>'+Math.abs(x.dl)+t.enMes+'</div>';
    } else if(x.dl===0){dd='<div class="d fl">'+t.sinCambio+'</div>'}
    return '<div class="k '+x.cl+'"><div class="lb">'+x.lb+'</div><div class="v">'+x.v+
      '</div><div class="s">'+x.s+'</div>'+dd+'</div>'}).join('');

  chart1(idx);chart2(idx);chart3(idx);
  document.getElementById('r1').innerHTML=t.r1(fmt(o.ms[1].tf,' d'),fmt(o.ms[2].tf,' d'));
  var mx=o.real.length?Math.max.apply(null,o.real):0;
  var pm=o.plan.length?(o.plan.reduce(function(a,b){return a+b},0)/o.plan.length):0;
  document.getElementById('r2').innerHTML=o.plan.length
    ? t.r2(mx,Math.round(pm),mx?(pm/mx).toFixed(1):'—') : t.r2b(mx);

  var rows;
  if(o.dur===null){rows='<tr><td colspan="2" style="color:var(--ink3)">'+t.mRef+'</td></tr>'}
  else{rows=[[t.mDur,o.dur,1],[t.mRelD,o.relDel,1],[t.mRelA,o.relAdd,0],[t.mCstr,o.cstr,1],
             [t.mActA,o.actAdd,0],[t.mDone,o.perDone,0],[t.mFuera,o.fuera,0],[t.mNeg,o.neg,0]]
    .map(function(r){return '<tr><td>'+r[0]+'</td><td class="n nm'+(r[2]&&r[1]?' hot':'')+'">'+N(r[1])+'</td></tr>'}).join('')}
  document.getElementById('mod').innerHTML=rows;
  var nt=NOTE[o.id]||['','',''];
  var tn=lang==='es'?nt[1]:nt[2];
  document.getElementById('modnote').innerHTML=tn?'<p class="note '+nt[0]+'">'+tn+'</p>':'';

  document.getElementById('chains').innerHTML=o.chains.length
    ? '<thead><tr><th>'+t.cFloat+'</th><th>'+t.cAct+'</th><th>'+t.cOrig+'</th></tr></thead><tbody>'+
      o.chains.map(function(c){return '<tr><td><span class="pill '+kl(c.tf)+'">'+fmt(c.tf,' d')+
        '</span></td><td class="nm">'+c.n+'</td><td><span class="mo">'+c.code+'</span><div class="sub">'+
        c.name+'</div></td></tr>'}).join('')+'</tbody>'
    : '<tr><td style="color:var(--ink3)">'+t.cNone+'</td></tr>';

  document.getElementById('risk').innerHTML=o.risk.length
    ? '<thead><tr><th>'+t.rAct+'</th><th>'+t.rLf+'</th><th class="n">'+t.rTf+'</th></tr></thead><tbody>'+
      o.risk.map(function(r){return '<tr><td><span class="mo">'+r.code+'</span><div class="sub">'+r.name+
        '</div></td><td class="mo">'+fd(r.lf)+'</td><td class="n"><span class="pill '+kl(r.tf)+'">'+
        fmt(r.tf,' d')+'</span></td></tr>'}).join('')+'</tbody>'
    : '<tr><td style="color:var(--ink3)">'+t.rNone+'</td></tr>';

  Array.prototype.forEach.call(document.querySelectorAll('.exp'),function(b){
    var id='c'+b.dataset.c;
    b.setAttribute('title',BIG[id]?t.small:t.big);
    b.setAttribute('aria-label',BIG[id]?t.small:t.big)});
}

Array.prototype.forEach.call(document.querySelectorAll('.exp'),function(b){
  b.addEventListener('click',function(){
    var id='c'+b.dataset.c, card=b.closest('.card');
    BIG[id]=!BIG[id];card.classList.toggle('big',BIG[id]);
    b.querySelector('.ms').textContent=BIG[id]?'close_fullscreen':'open_in_full';
    render()})});
sel.addEventListener('change',render);
lgs.addEventListener('change',function(){lang=lgs.value;
  try{localStorage.setItem('domus_lang',lang)}catch(e){}
  fillSel();render()});
render();
window.addEventListener('resize',render);
})();
</script>

</body></html>
