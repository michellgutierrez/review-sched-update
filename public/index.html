<style>
/* Layout: barra con selectores de versión e idioma, franja de KPIs, tres gráficos con tooltip, panel de integridad */
:root{
  --bg:#F1F3F4; --surface:#FFFFFF; --s2:#F1F3F4; --s3:#E8EAED;
  --ink:#202124; --ink2:#5F6368; --ink3:#80868B;
  --line:#DADCE0; --line2:#BDC1C6;
  --acc:#1A73E8; --accbg:#E8F0FE;
  --crit:#D93025; --critbg:#FCE8E6;
  --warn:#E37400; --warnbg:#FEF7E0;
  --ok:#1E8E3E; --okbg:#E6F4EA;
  --grid:#E8EAED;
  --sh:0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
  --sh2:0 1px 3px 0 rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
  --fs:"Roboto","Helvetica Neue",Arial,sans-serif;
  --fm:"Roboto Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#202124; --surface:#292A2D; --s2:#35363A; --s3:#3C4043;
  --ink:#E8EAED; --ink2:#9AA0A6; --ink3:#80868B;
  --line:#3C4043; --line2:#5F6368;
  --acc:#8AB4F8; --accbg:#1F3047;
  --crit:#F28B82; --critbg:#3B2220;
  --warn:#FDD663; --warnbg:#3A2F15;
  --ok:#81C995; --okbg:#1C2E22;
  --grid:#35363A;
  --sh:0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
  --sh2:0 1px 3px 0 rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#202124; --surface:#292A2D; --s2:#35363A; --s3:#3C4043;
  --ink:#E8EAED; --ink2:#9AA0A6; --ink3:#80868B;
  --line:#3C4043; --line2:#5F6368;
  --acc:#8AB4F8; --accbg:#1F3047;
  --crit:#F28B82; --critbg:#3B2220;
  --warn:#FDD663; --warnbg:#3A2F15;
  --ok:#81C995; --okbg:#1C2E22;
  --grid:#35363A;
  --sh:0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
  --sh2:0 1px 3px 0 rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);font-size:13px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;
  -webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased;user-select:none}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:14px 32px}
h1,h2,h3{margin:0;font-weight:500}

.bar{background:var(--surface);border-radius:12px;box-shadow:var(--sh);padding:12px 16px;
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:12px}
.bar h1{font-size:16px;display:flex;align-items:center;gap:9px}
.bar h1 .ms{font-size:21px;color:var(--acc)}
.bar .job{font-family:var(--fm);font-size:11.5px;color:var(--ink3);padding-left:2px}
.ctl{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fld{display:flex;align-items:center;gap:8px}
.fld label{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
select{font-family:var(--fs);font-size:13px;font-weight:500;color:var(--ink);background:var(--surface);
  border:1px solid var(--line2);border-radius:8px;padding:7px 11px;cursor:pointer}
#sel{min-width:186px}
select:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.meta{font-family:var(--fm);font-size:11.5px;color:var(--ink2)}
.meta b{color:var(--ink);font-weight:500}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:1040px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.k{background:var(--surface);border-radius:12px;box-shadow:var(--sh);padding:11px 13px 12px;min-width:0;
  border-top:3px solid transparent}
.k.c{border-top-color:var(--crit)} .k.w{border-top-color:var(--warn)} .k.o{border-top-color:var(--ok)}
.k .lb{font-size:10.5px;color:var(--ink2);font-weight:500;text-transform:uppercase;letter-spacing:.05em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .v{font-family:var(--fm);font-size:24px;font-weight:500;line-height:1.1;margin-top:5px}
.k.c .v{color:var(--crit)} .k.w .v{color:var(--warn)} .k.o .v{color:var(--ok)}
.k .s{font-size:11px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .d{font-family:var(--fm);font-size:11px;margin-top:4px;display:flex;align-items:center;gap:3px}
.k .d .ms{font-size:14px}
.dn{color:var(--crit)} .up{color:var(--ok)} .fl{color:var(--ink3)}

.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--sh);padding:13px 15px 12px;min-width:0;position:relative}
.card h3{font-size:13px;margin-bottom:2px;padding-right:34px}
.card .nt{font-size:11.5px;color:var(--ink3);margin:0 0 9px}
.card .rd{font-size:11.5px;color:var(--ink2);margin:9px 0 0;padding-top:9px;border-top:1px solid var(--line);line-height:1.5}
.card .rd b{color:var(--ink);font-weight:500}
.exp{position:absolute;top:9px;right:10px;width:28px;height:28px;border-radius:50%;border:none;padding:0;
  background:transparent;color:var(--ink3);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s}
.exp:hover{background:var(--s2);color:var(--ink)}
.exp:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.exp .ms{font-size:17px}
.card.big{grid-column:1/-1}
.lg{display:flex;flex-wrap:wrap;gap:4px 13px;font-size:11px;color:var(--ink2);margin-bottom:6px}
.lg span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:3px;border-radius:2px;flex:none}
.sw.q{width:9px;height:9px;border-radius:2px}
.plot{position:relative}
svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);
  border-radius:6px;padding:6px 9px;font-size:11.5px;line-height:1.5;white-space:nowrap;
  box-shadow:var(--sh2);opacity:0;transition:opacity .12s;z-index:5;font-family:var(--fm)}
.tip.on{opacity:1}
.tip .th{font-family:var(--fs);font-weight:500;font-size:11px;opacity:.72;margin-bottom:2px}
.tip i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);padding:0 7px 6px 0;border-bottom:1px solid var(--line)}
th.n,td.n{text-align:right;padding-right:0}
td{padding:7px 7px 7px 0;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.mo{font-family:var(--fm);font-size:11.5px}
.nm{font-family:var(--fm);font-weight:500}
.nm.hot{color:var(--crit)}
.pill{display:inline-block;font-family:var(--fm);font-size:10.5px;font-weight:500;
  padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.c{background:var(--critbg);color:var(--crit)}
.pill.w{background:var(--warnbg);color:var(--warn)}
.pill.o{background:var(--okbg);color:var(--ok)}
.note{margin:10px 0 0;padding:10px 12px;background:var(--s2);border-radius:8px;
  font-size:11.5px;color:var(--ink2);line-height:1.55}
.note.c{background:var(--critbg);color:var(--crit)}
.note.w{background:var(--warnbg);color:var(--warn)}
.note b{font-weight:500}
.note code{font-family:var(--fm);font-size:11px;background:rgba(128,134,139,.2);padding:1px 5px;border-radius:4px}
.sub{font-size:11px;color:var(--ink3);line-height:1.5;margin-top:2px}
footer{margin-top:14px;padding:12px 15px;background:var(--surface);border-radius:12px;box-shadow:var(--sh);
  font-size:11px;color:var(--ink3);line-height:1.6}
footer code{font-family:var(--fm);font-size:10.5px;background:var(--s2);padding:1px 4px;border-radius:3px}
/* Carga de archivos .xer desde el navegador */
.btn{font-family:var(--fs);font-size:12.5px;font-weight:500;color:var(--ink);background:var(--surface);
  border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--s2)}
.btn .ms{font-size:17px;margin:0}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#1765CC}
.btn.pri:disabled{opacity:.5;cursor:default}
.src{font-family:var(--fm);font-size:11px;color:var(--ink3);display:flex;
  align-items:center;gap:7px;flex-wrap:wrap}
.src b{color:var(--ink2);font-weight:500}
.src .dot{width:6px;height:6px;border-radius:50%;background:var(--line2);flex:none}
.src.on .dot{background:var(--ok)}
.src .lk{color:var(--acc);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.ovl{position:fixed;inset:0;z-index:40;background:rgba(32,33,36,.55);
  display:none;align-items:center;justify-content:center;padding:20px}
.ovl.on{display:flex}
.ovl .bx{background:var(--surface);border-radius:14px;box-shadow:var(--sh2);
  padding:24px 28px;max-width:540px;width:100%;max-height:92vh;overflow:auto}
.ovl h2{font-size:16px;font-weight:500;margin:0 0 7px;display:flex;align-items:center;gap:9px}
.ovl h2 .ms{font-size:21px;color:var(--acc)}
.ovl p{font-size:12.5px;color:var(--ink2);margin:0 0 13px;line-height:1.55}
.ovl p b{color:var(--ink);font-weight:500}
.zone{border:2px dashed var(--line2);border-radius:12px;padding:24px 18px;text-align:center;
  cursor:pointer;transition:border-color .12s,background .12s}
.zone:hover,.zone.hv{border-color:var(--acc);background:var(--s2)}
.zone .ms{font-size:30px;color:var(--ink3);display:block;margin:0 0 6px}
.zone .z1{font-size:13px;font-weight:500}
.zone .z2{font-size:11.5px;color:var(--ink3);margin-top:3px}
.log{font-family:var(--fm);font-size:11px;color:var(--ink2);margin-top:13px;
  max-height:160px;overflow:auto;line-height:1.65}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .er{color:var(--crit)} .log .ok{color:var(--ok)}
.ax{display:flex;gap:9px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.ax .sp{margin-right:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--surface);font-size:12.5px;padding:10px 16px;border-radius:8px;
  box-shadow:var(--sh2);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:60;
  max-width:min(92vw,460px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

(function(){
/* Datos: el tablero trae 12 versiones incorporadas; si el usuario cargó archivos
   en una visita anterior se reemplazan por el resultado guardado (métricas, no archivos). */
var EMB=JSON.parse(document.getElementById('data').textContent);
var D=EMB, SRC=null;
try{var sj=localStorage.getItem('domus_data');
  if(sj){var so=JSON.parse(sj);
    if(so&&so.d&&so.d.length){D=so.d;SRC=so.s||{n:so.d.length,when:''}}}}catch(e){}

/* ═══ Lectura de .xer en el navegador ═══
   Replica el cálculo verificado contra las 12 versiones del análisis forense. */
function parseXer(text){
  var tables={},cur=null,cols=null,rows=null;
  var lines=text.split('\n');
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(!line)continue;
    if(line.charCodeAt(line.length-1)===13)line=line.slice(0,-1);
    if(!line)continue;
    var p=line.split('\t');
    if(p[0]==='%T'){
      if(cur&&cols)tables[cur]={cols:cols,rows:rows,idx:colIdx(cols)};
      cur=p[1];cols=null;rows=[];
    } else if(p[0]==='%F'){ cols=p.slice(1);
    } else if(p[0]==='%R'&&cols){
      var v=p.slice(1);
      if(v.length<cols.length){while(v.length<cols.length)v.push('')}
      else if(v.length>cols.length)v=v.slice(0,cols.length);
      rows.push(v);
    }
  }
  if(cur&&cols)tables[cur]={cols:cols,rows:rows,idx:colIdx(cols)};
  return tables;
}
function colIdx(cols){var m={};for(var i=0;i<cols.length;i++)m[cols[i]]=i;return m}
function pdt(s){
  if(!s)return null;
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:\s+(\d{2}):(\d{2}))?/);
  if(!m)return null;
  return new Date(+m[1],+m[2]-1,+m[3],m[4]?+m[4]:0,m[5]?+m[5]:0);
}
function isod(d){ if(!d)return null;
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function nmv(s){ if(s===''||s===null||s===undefined)return null; var v=parseFloat(s); return isNaN(v)?null:v}
function r2(v){ return v===null?null:Math.round(v*100)/100 }

var MSDEF=[['PR-MS-200','ms1','2027-08-21'],['PR-MS-300','ms2','2027-10-21'],
           ['PR-MS-400','ms3','2027-12-21'],['PR-MS-800','tco','2028-03-21'],
           ['PR-MS-900','co','2028-05-22']];

/* la etiqueta sale del nombre del archivo: proj_short_name viene truncado en algunas versiones */
function vlabel(fileName,shortName){
  var m=fileName.match(/upd[^0-9]{0,4}(\d{1,2})/i);
  if(m)return 'U'+String(+m[1]).padStart(2,'0');
  m=(shortName||'').match(/upd\s*(\d{1,2})/i);
  if(m)return 'U'+String(+m[1]).padStart(2,'0');
  if(/baseline/i.test(fileName)){
    var v=fileName.match(/v?(\d+[._]\d+[a-z]?)/i);
    return 'BL'+(v?' '+v[1].replace('_','.'):'');
  }
  if(/phased/i.test(fileName))return 'Fásico';
  return (shortName||fileName).replace(/\.xer$/i,'').replace(/^.*?[-_]/,'').slice(0,12);
}

function readVersion(text,fileName){
  var t=parseXer(text);
  var TK=t.TASK, PJ=t.PROJECT, TP=t.TASKPRED;
  if(!TK||!PJ||!PJ.rows.length)throw new Error('sin tablas TASK / PROJECT');
  var pi=PJ.idx, prow=PJ.rows[0];
  var dd=pdt(prow[pi.last_recalc_date]);
  if(!dd)throw new Error('sin data date (last_recalc_date)');
  var short=prow[pi.proj_short_name]||'';
  var x=TK.idx;
  var acts=[],byCode={},rel=[],idCode={};
  for(var i=0;i<TK.rows.length;i++){
    var r=TK.rows[i];
    var a={id:r[x.task_id],code:r[x.task_code],name:r[x.task_name],
      st:r[x.status_code],type:r[x.task_type],wbs:r[x.wbs_id],
      tf:nmv(r[x.total_float_hr_cnt]),td:nmv(r[x.target_drtn_hr_cnt]),rd:nmv(r[x.remain_drtn_hr_cnt]),
      ee:pdt(r[x.early_end_date]),es:pdt(r[x.early_start_date]),lf:pdt(r[x.late_end_date]),
      ae:pdt(r[x.act_end_date]),as_:pdt(r[x.act_start_date]),
      cs:(r[x.cstr_type]||'')+'|'+(r[x.cstr_date]||'')};
    a.tfd=a.tf===null?null:a.tf/8;
    acts.push(a);byCode[a.code]=a;idCode[a.id]=a.code;
  }
  if(TP){var y=TP.idx;
    for(var j=0;j<TP.rows.length;j++){var q=TP.rows[j];
      rel.push(idCode[q[y.pred_task_id]]+'>'+idCode[q[y.task_id]]+'>'+q[y.pred_type])}}
  return {id:vlabel(fileName,short),file:fileName,dd:dd,short:short,
          acts:acts,byCode:byCode,rel:rel};
}

function metrics(V,PV){
  var acts=V.acts,dd=V.dd;
  var pend=acts.filter(function(a){return a.st!=='TK_Complete'});
  var done=acts.filter(function(a){return a.st==='TK_Complete'});
  var o={id:V.id,dd:isod(dd),nAct:acts.length,nRel:V.rel.length,
         done:done.length,pend:pend.length,
         neg:pend.filter(function(a){return a.tfd!==null&&a.tfd<0}).length};

  o.ms=MSDEF.map(function(m){
    var a=V.byCode[m[0]];
    return {code:m[0],k:m[1],ctr:m[2],tf:a?r2(a.tfd):null,fc:a?isod(a.ee):null}});

  /* bandas de holgura: actividades que se mueven juntas */
  var band={};
  pend.forEach(function(a){ if(a.tfd===null)return;
    var v=Math.round(a.tfd*100)/100;
    (band[v]=band[v]||[]).push(a)});
  var keys=Object.keys(band).map(Number).sort(function(a,b){return a-b});
  o.ch5=0;o.ch5act=0;
  keys.forEach(function(v){ if(v<=5&&band[v].length>=5){o.ch5++;o.ch5act+=band[v].length}});
  o.chains=[];
  for(var i=0;i<keys.length&&o.chains.length<5;i++){
    var v=keys[i]; if(v>12||band[v].length<5)continue;
    var g=band[v].slice().sort(function(a,b){return (a.ee||0)-(b.ee||0)});
    o.chains.push({tf:v,n:band[v].length,code:g[0].code,name:(g[0].name||'').slice(0,52)});
  }

  o.risk=acts.filter(function(a){return a.st==='TK_Active'})
    .sort(function(a,b){return (a.tfd===null?9e9:a.tfd)-(b.tfd===null?9e9:b.tfd)})
    .slice(0,4).map(function(a){return {code:a.code,name:(a.name||'').slice(0,46),
      lf:isod(a.lf),tf:r2(a.tfd)}});

  var rm={},pm={};
  done.forEach(function(a){ if(!a.ae)return; var k=ymd(a.ae); rm[k]=(rm[k]||0)+1});
  var ddm=ymd(dd);
  pend.forEach(function(a){ if(!a.ee)return; var k=ymd(a.ee); if(k<=ddm)return; pm[k]=(pm[k]||0)+1});
  var rk=Object.keys(rm).sort(), pk=Object.keys(pm).sort().slice(0,12);
  o.realLab=rk; o.real=rk.map(function(k){return rm[k]});
  o.planLab=pk; o.plan=pk.map(function(k){return pm[k]});

  if(PV){
    var durCh=0;
    acts.forEach(function(a){var b=PV.byCode[a.code];
      if(b&&b.td!==null&&a.td!==null&&b.td!==a.td)durCh++});
    o.dur=durCh;
    var sa={},sb={};
    PV.rel.forEach(function(r){sa[r]=1}); V.rel.forEach(function(r){sb[r]=1});
    o.relDel=Object.keys(sa).filter(function(r){return !sb[r]}).length;
    o.relAdd=Object.keys(sb).filter(function(r){return !sa[r]}).length;
    var cs=0;
    acts.forEach(function(a){var b=PV.byCode[a.code]; if(b&&b.cs!==a.cs)cs++});
    o.cstr=cs;
    o.actAdd=acts.filter(function(a){return !PV.byCode[a.code]}).length;
    /* cumplimiento: lo que la versión anterior prometía para este periodo,
       cruzado por código contra lo que efectivamente cerró dentro del periodo */
    var dp=PV.dd, prom={},np=0;
    PV.acts.forEach(function(a){
      if(a.st!=='TK_Complete'&&a.ee&&a.ee<=dd){prom[a.code]=1;np++}});
    var term=[],cump=0;
    acts.forEach(function(a){
      if(a.st==='TK_Complete'&&a.ae&&a.ae>dp&&a.ae<=dd){
        term.push(a.code); if(prom[a.code])cump++}});
    o.prom=np; o.cump=cump; o.perDone=term.length;
    o.fuera=term.filter(function(c){return !prom[c]}).length;
    o.ppc=np?Math.round(1000*cump/np)/10:null;
  } else {
    o.dur=null;o.relDel=null;o.relAdd=null;o.cstr=null;o.actAdd=null;
    o.prom=null;o.cump=null;o.perDone=null;o.fuera=null;o.ppc=null;
  }
  return o;
}

function buildDataset(versions){
  versions.sort(function(a,b){return a.dd-b.dd});
  var out=[];
  for(var i=0;i<versions.length;i++)out.push(metrics(versions[i],i?versions[i-1]:null));
  return out;
}

function hook(svg,tip,n,xf,build,d){
  var W=d.W,H=d.H,T=d.T,ih=d.ih;
  var hot=E('rect',{x:0,y:0,width:W,height:H,fill:'transparent'});svg.appendChild(hot);
  var mk=E('line',{x1:0,y1:T,x2:0,y2:T+ih,stroke:cs('--line2'),'stroke-width':1,opacity:0});svg.appendChild(mk);
  function move(ev){
    var r=svg.getBoundingClientRect();
    var cx=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width*W;
    var best=0,bd=1e9;
    for(var i=0;i<n;i++){var q=Math.abs(xf(i)-cx);if(q<bd){bd=q;best=i}}
    mk.setAttribute('x1',xf(best));mk.setAttribute('x2',xf(best));mk.setAttribute('opacity','1');
    tip.innerHTML=build(best);tip.classList.add('on');
    var px=xf(best)/W*r.width;
    tip.style.left=Math.max(4,Math.min(r.width-tip.offsetWidth-4,px-tip.offsetWidth/2))+'px';
    tip.style.top='2px';
  }
  function out(){mk.setAttribute('opacity','0');tip.classList.remove('on')}
  svg.addEventListener('mousemove',move);svg.addEventListener('mouseleave',out);
  svg.addEventListener('touchstart',move,{passive:true});
  svg.addEventListener('touchmove',move,{passive:true});svg.addEventListener('touchend',out);
}

function chart1(idx){

  var all=g2.concat(g3,gt).filter(function(v){return v!==null});
  var hi=Math.max(80,Math.ceil(Math.max.apply(null,all)/10)*10), lo=Math.min(-55,Math.floor(Math.min.apply(null,all)/10)*10);
  function X(i){return Lm+iw*i/(lab.length-1)} function Y(v){return T+ih*(hi-v)/(hi-lo)}
  [hi,Math.round((hi+lo)/2/10)*10,0,lo].forEach(function(v){
    s.appendChild(E('line',{x1:Lm,y1:Y(v),x2:Lm+iw,y2:Y(v),stroke:v===0?cs('--line2'):cs('--grid'),'stroke-width':v===0?1.2:1}));

  lab.forEach(function(t,i){s.appendChild(txt(X(i),H-(d.big?13:9),t,{mono:1,sz:d.big?11:9,fill:i===idx?cs('--acc'):cs('--ink3')}))});

    return '<div class="th">'+D[i].id+' · '+fd(D[i].dd)+'</div>'+

      '<i style="background:'+C.ms3+'"></i>'+L().ms3.split('·')[0].trim()+'  '+fmt(g3[i],' d')+'<br>'+

function chart2(idx){

function readFile(f){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onerror=function(){rej(new Error('no se pudo leer el archivo'))};
    r.onload=function(){
      try{res(new TextDecoder('windows-1252').decode(r.result))}
      catch(e){res(new TextDecoder('iso-8859-1').decode(r.result))}};
    r.readAsArrayBuffer(f)})
}

function load(fl){
  var t=L(), files=Array.prototype.slice.call(fl)
    .filter(function(f){return /\.xer$/i.test(f.name)});
  if(!files.length){say(t.lgNone,'er');return}
  var V=[], i=0;
  (function step(){
    if(i>=files.length)return done();
    var f=files[i];
    say(t.lgRead(i+1,files.length,f.name));
    readFile(f).then(function(txt){
      try{var v=readVersion(txt,f.name);V.push(v);
        logb.lastChild.className='ok';
        logb.lastChild.textContent=t.lgOk(v.id,v.dd.toISOString().slice(0,10),
          v.acts.length.toLocaleString(lang));
      }catch(e){logb.lastChild.className='er';
        logb.lastChild.textContent=t.lgEr(f.name,e.message)}
      i++;setTimeout(step,0);
    }).catch(function(e){logb.lastChild.className='er';
      logb.lastChild.textContent=t.lgEr(f.name,e.message);i++;setTimeout(step,0)});
  })();

  function done(){
    if(!V.length){say(t.lgNone,'er');return}
    /* una etiqueta repetida se resuelve por data date: gana la más reciente */
    var seen={},keep=[];
    V.sort(function(a,b){return b.dd-a.dd});
    V.forEach(function(v){if(seen[v.id]){say(t.lgDup(v.id),'er');return}seen[v.id]=1;keep.push(v)});
    var ds=buildDataset(keep);
    if(!ds.some(function(o){return o.ms.some(function(m){return m.tf!==null})}))say(t.lgNoMs,'er');
    if(ds.length===1)say(t.lgOne,'er');
    D=ds;
    SRC={n:ds.length,when:new Date().toLocaleDateString(lang==='es'?'es':'en',
      {day:'2-digit',month:'short',year:'numeric'})};
    try{localStorage.setItem('domus_data',JSON.stringify({d:D,s:SRC}))}
    catch(e){say(t.lgBig(''),'er')}
    sel.value='';fillSel();render();
    say(t.lgDone(ds.length),'ok');
  }
}

/* mismas seis tablas que la hoja de cálculo entregada con el análisis */
function tables(){
  var h=XH[lang], T={Resumen:[h.Resumen],Hitos:[h.Hitos],Produccion:[h.Produccion],
      Cumplimiento:[h.Cumplimiento],Cadenas:[h.Cadenas],En_curso:[h.En_curso]}, prev=null;
  D.forEach(function(o){
    var m={}; o.ms.forEach(function(x){m[x.k]=x});
    T.Resumen.push([o.id,o.dd,o.nAct,o.nRel,o.done,o.pend,o.neg,
      m.ms1.tf,m.ms2.tf,m.ms3.tf,m.tco.tf,m.co.tf,m.ms2.fc,m.ms3.fc,m.tco.fc,
      o.ch5,o.ch5act,o.dur,o.relDel,o.relAdd,o.cstr,o.actAdd,
      o.prom,o.cump,o.fuera,o.perDone,o.ppc]);
    o.ms.forEach(function(x){
      var d=(x.tf===null||!prev||prev[x.k]===null||prev[x.k]===undefined)
        ?null:Math.round((x.tf-prev[x.k])*100)/100;
      T.Hitos.push([o.id,o.dd,h.ms[x.k],x.code,x.ctr,x.tf,x.fc,d])});
    prev={};o.ms.forEach(function(x){prev[x.k]=x.tf});
    o.realLab.forEach(function(l,i){T.Produccion.push([o.id,o.dd,l,h.sReal,o.real[i]])});
    o.planLab.forEach(function(l,i){T.Produccion.push([o.id,o.dd,l,h.sPlan,o.plan[i]])});
    if(o.ppc!==null)T.Cumplimiento.push([o.id,o.dd,o.prom,o.cump,o.ppc,o.perDone,o.fuera,
      o.perDone?Math.round(1000*o.fuera/o.perDone)/10:null]);
    o.chains.forEach(function(c){T.Cadenas.push([o.id,o.dd,c.tf,c.n,c.code,c.name])});
    o.risk.forEach(function(x){T.En_curso.push([o.id,o.dd,x.code,x.name,x.lf,x.tf])});
  });
  return T;
}

function grab(name,blob){
  if(DLN){DLN.save({filename:name,data:blob}).catch(function(e){
    if(e&&e.code!=='declined')toast(L().dlErr+(e&&e.code?' ('+e.code+')':''))});return}
  var u=URL.createObjectURL(blob), a=document.createElement('a');

  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u)},0);
}
var XLIB='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function dlXlsx(){
  var t=L();
  function go(){
    var T=tables(), wb=XLSX.utils.book_new();
    ['Resumen','Hitos','Produccion','Cumplimiento','Cadenas','En_curso'].forEach(function(k){
      var ws=XLSX.utils.aoa_to_sheet(T[k]);
      ws['!cols']=T[k][0].map(function(c){return {wch:Math.max(11,Math.min(52,c.length+4))}});
      ws['!freeze']={xSplit:0,ySplit:1};
      XLSX.utils.book_append_sheet(wb,ws,k)});
    var buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    grab(XH[lang].file+'.xlsx',new Blob([buf],
      {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  }
  if(window.XLSX)return go();
  var s=document.createElement('script');s.src=XLIB;
  s.onload=go; s.onerror=function(){dlCsv(t)};
  document.head.appendChild(s);
}
/* si la librería no carga, una sola hoja con las seis tablas en secciones */
function dlCsv(t){
  var T=tables(), out=[];
  ['Resumen','Hitos','Produccion','Cumplimiento','Cadenas','En_curso'].forEach(function(k){
    out.push(k);
    T[k].forEach(function(row){
      out.push(row.map(function(v){
        if(v===null||v===undefined)return '';
        v=String(v);
        return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(','))});
    out.push('')});
  grab(XH[lang].file+'.csv',new Blob(['﻿'+out.join('\r\n')],{type:'text/csv;charset=utf-8'}));
}
