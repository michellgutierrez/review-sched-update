<meta charset="utf-8">
<title>Tablero Domus II</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<style>
/* Layout: barra con selectores de versión e idioma, franja de KPIs, tres gráficos con tooltip, panel de integridad */
:root{
  --bg:#F1F3F4; --surface:#FFFFFF; --s2:#F1F3F4; --s3:#E8EAED;
  --ink:#202124; --ink2:#5F6368; --ink3:#80868B;
  --line:#DADCE0; --line2:#BDC1C6;
  --acc:#1A73E8; --accbg:#E8F0FE;
  --crit:#D93025; --critbg:#FCE8E6;
  --warn:#E37400; --warnbg:#FEF7E0;
  --ok:#1E8E3E; --okbg:#E6F4EA;
  --grid:#E8EAED;
  --sh:0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
  --sh2:0 1px 3px 0 rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
  --fs:"Roboto","Helvetica Neue",Arial,sans-serif;
  --fm:"Roboto Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#202124; --surface:#292A2D; --s2:#35363A; --s3:#3C4043;
  --ink:#E8EAED; --ink2:#9AA0A6; --ink3:#80868B;
  --line:#3C4043; --line2:#5F6368;
  --acc:#8AB4F8; --accbg:#1F3047;
  --crit:#F28B82; --critbg:#3B2220;
  --warn:#FDD663; --warnbg:#3A2F15;
  --ok:#81C995; --okbg:#1C2E22;
  --grid:#35363A;
  --sh:0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
  --sh2:0 1px 3px 0 rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#202124; --surface:#292A2D; --s2:#35363A; --s3:#3C4043;
  --ink:#E8EAED; --ink2:#9AA0A6; --ink3:#80868B;
  --line:#3C4043; --line2:#5F6368;
  --acc:#8AB4F8; --accbg:#1F3047;
  --crit:#F28B82; --critbg:#3B2220;
  --warn:#FDD663; --warnbg:#3A2F15;
  --ok:#81C995; --okbg:#1C2E22;
  --grid:#35363A;
  --sh:0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
  --sh2:0 1px 3px 0 rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);font-size:13px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;
  -webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased;user-select:none}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:14px 32px}
h1,h2,h3{margin:0;font-weight:500}

.bar{background:var(--surface);border-radius:12px;box-shadow:var(--sh);padding:12px 16px;
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:12px}
.bar h1{font-size:16px;display:flex;align-items:center;gap:9px}
.bar h1 .ms{font-size:21px;color:var(--acc)}
.bar .job{font-family:var(--fm);font-size:11.5px;color:var(--ink3);padding-left:2px}
.ctl{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fld{display:flex;align-items:center;gap:8px}
.fld label{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
select{font-family:var(--fs);font-size:13px;font-weight:500;color:var(--ink);background:var(--surface);
  border:1px solid var(--line2);border-radius:8px;padding:7px 11px;cursor:pointer}
#sel{min-width:186px}
select:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.meta{font-family:var(--fm);font-size:11.5px;color:var(--ink2)}
.meta b{color:var(--ink);font-weight:500}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:1040px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.k{background:var(--surface);border-radius:12px;box-shadow:var(--sh);padding:11px 13px 12px;min-width:0;
  border-top:3px solid transparent}
.k.c{border-top-color:var(--crit)} .k.w{border-top-color:var(--warn)} .k.o{border-top-color:var(--ok)}
.k .lb{font-size:10.5px;color:var(--ink2);font-weight:500;text-transform:uppercase;letter-spacing:.05em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .v{font-family:var(--fm);font-size:24px;font-weight:500;line-height:1.1;margin-top:5px}
.k.c .v{color:var(--crit)} .k.w .v{color:var(--warn)} .k.o .v{color:var(--ok)}
.k .s{font-size:11px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .d{font-family:var(--fm);font-size:11px;margin-top:4px;display:flex;align-items:center;gap:3px}
.k .d .ms{font-size:14px}
.dn{color:var(--crit)} .up{color:var(--ok)} .fl{color:var(--ink3)}

.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--sh);padding:13px 15px 12px;min-width:0;position:relative}
.card h3{font-size:13px;margin-bottom:2px;padding-right:34px}
.card .nt{font-size:11.5px;color:var(--ink3);margin:0 0 9px}
.card .rd{font-size:11.5px;color:var(--ink2);margin:9px 0 0;padding-top:9px;border-top:1px solid var(--line);line-height:1.5}
.card .rd b{color:var(--ink);font-weight:500}
.exp{position:absolute;top:9px;right:10px;width:28px;height:28px;border-radius:50%;border:none;padding:0;
  background:transparent;color:var(--ink3);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s}
.exp:hover{background:var(--s2);color:var(--ink)}
.exp:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.exp .ms{font-size:17px}
.card.big{grid-column:1/-1}
.lg{display:flex;flex-wrap:wrap;gap:4px 13px;font-size:11px;color:var(--ink2);margin-bottom:6px}
.lg span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:3px;border-radius:2px;flex:none}
.sw.q{width:9px;height:9px;border-radius:2px}
.plot{position:relative}
svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);
  border-radius:6px;padding:6px 9px;font-size:11.5px;line-height:1.5;white-space:nowrap;
  box-shadow:var(--sh2);opacity:0;transition:opacity .12s;z-index:5;font-family:var(--fm)}
.tip.on{opacity:1}
.tip .th{font-family:var(--fs);font-weight:500;font-size:11px;opacity:.72;margin-bottom:2px}
.tip i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);padding:0 7px 6px 0;border-bottom:1px solid var(--line)}
th.n,td.n{text-align:right;padding-right:0}
td{padding:7px 7px 7px 0;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.mo{font-family:var(--fm);font-size:11.5px}
.nm{font-family:var(--fm);font-weight:500}
.nm.hot{color:var(--crit)}
.pill{display:inline-block;font-family:var(--fm);font-size:10.5px;font-weight:500;
  padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.c{background:var(--critbg);color:var(--crit)}
.pill.w{background:var(--warnbg);color:var(--warn)}
.pill.o{background:var(--okbg);color:var(--ok)}
.note{margin:10px 0 0;padding:10px 12px;background:var(--s2);border-radius:8px;
  font-size:11.5px;color:var(--ink2);line-height:1.55}
.note.c{background:var(--critbg);color:var(--crit)}
.note.w{background:var(--warnbg);color:var(--warn)}
.note b{font-weight:500}
.note code{font-family:var(--fm);font-size:11px;background:rgba(128,134,139,.2);padding:1px 5px;border-radius:4px}
.sub{font-size:11px;color:var(--ink3);line-height:1.5;margin-top:2px}
footer{margin-top:14px;padding:12px 15px;background:var(--surface);border-radius:12px;box-shadow:var(--sh);
  font-size:11px;color:var(--ink3);line-height:1.6}
footer code{font-family:var(--fm);font-size:10.5px;background:var(--s2);padding:1px 4px;border-radius:3px}
/* Carga de archivos .xer desde el navegador */
.btn{font-family:var(--fs);font-size:12.5px;font-weight:500;color:var(--ink);background:var(--surface);
  border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--s2)}
.btn .ms{font-size:17px;margin:0}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#1765CC}
.btn.pri:disabled{opacity:.5;cursor:default}
.src{font-family:var(--fm);font-size:11px;color:var(--ink3);display:flex;
  align-items:center;gap:7px;flex-wrap:wrap}
.src b{color:var(--ink2);font-weight:500}
.src .dot{width:6px;height:6px;border-radius:50%;background:var(--line2);flex:none}
.src.on .dot{background:var(--ok)}
.src .lk{color:var(--acc);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.ovl{position:fixed;inset:0;z-index:40;background:rgba(32,33,36,.55);
  display:none;align-items:center;justify-content:center;padding:20px}
.ovl.on{display:flex}
.ovl .bx{background:var(--surface);border-radius:14px;box-shadow:var(--sh2);
  padding:24px 28px;max-width:540px;width:100%;max-height:92vh;overflow:auto}
.ovl h2{font-size:16px;font-weight:500;margin:0 0 7px;display:flex;align-items:center;gap:9px}
.ovl h2 .ms{font-size:21px;color:var(--acc)}
.ovl p{font-size:12.5px;color:var(--ink2);margin:0 0 13px;line-height:1.55}
.ovl p b{color:var(--ink);font-weight:500}
.zone{border:2px dashed var(--line2);border-radius:12px;padding:24px 18px;text-align:center;
  cursor:pointer;transition:border-color .12s,background .12s}
.zone:hover,.zone.hv{border-color:var(--acc);background:var(--s2)}
.zone .ms{font-size:30px;color:var(--ink3);display:block;margin:0 0 6px}
.zone .z1{font-size:13px;font-weight:500}
.zone .z2{font-size:11.5px;color:var(--ink3);margin-top:3px}
.log{font-family:var(--fm);font-size:11px;color:var(--ink2);margin-top:13px;
  max-height:160px;overflow:auto;line-height:1.65}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .er{color:var(--crit)} .log .ok{color:var(--ok)}
.ax{display:flex;gap:9px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.ax .sp{margin-right:auto}
/* Sección de actividades críticas */
.sec{margin-top:16px}
.sec>h2{font-size:14.5px;font-weight:500;margin:0 0 3px;letter-spacing:-.1px}
.sec>p.nt{margin:0 0 11px}
.cstat{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
.cstat .b{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.cstat .b .v{font-family:var(--fm);font-size:21px;font-weight:500;line-height:1.1;letter-spacing:-.5px}
.cstat .b .k{font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.3}
.cstat .b.ok .v{color:var(--ok)} .cstat .b.bad .v{color:var(--crit)} .cstat .b.wrn .v{color:var(--warn)}
.g2b{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.g2c{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:900px){.g2c{grid-template-columns:1fr}}
@media(max-width:900px){.g2b{grid-template-columns:1fr}.cstat{grid-template-columns:repeat(2,1fr)}}
.lev{font-size:11.5px;line-height:1.55;color:var(--ink2);margin:0 0 9px}
.lev b{color:var(--ink);font-weight:500}
.tag{display:inline-block;font-family:var(--fm);font-size:10px;padding:1px 6px;border-radius:9px;
  background:var(--s2);color:var(--ink2);margin-right:5px;white-space:nowrap}
.tag.d{background:var(--warnbg);color:var(--warn)}
.tag.r{background:var(--s2);color:var(--ink2)}
.tag.c{background:var(--critbg);color:var(--crit)}
td .neg{color:var(--crit)} td .pos{color:var(--ok)}
th.sp,td.sp{padding-left:14px}
#salio td,#pal td{vertical-align:top}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--surface);font-size:12.5px;padding:10px 16px;border-radius:8px;
  box-shadow:var(--sh2);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:60;
  max-width:min(92vw,460px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<div class="wrap">

<div class="bar">
  <div>
    <h1><span class="ms">apartment</span>Domus Brickell Center · NB Domus II</h1>
    <div class="job" id="job"></div>
  </div>
  <div class="ctl">
    <div class="fld"><label for="sel" id="lsel"></label><select id="sel"></select></div>
    <div class="fld"><label for="lang" id="llang"></label>
      <select id="lang"><option value="es">Español</option><option value="en">English</option></select></div>
    <button class="btn" id="up"><span class="ms">upload_file</span><span id="upt"></span></button>
  </div>
  <div class="meta" id="meta"></div>
  <div class="src" id="src"><span class="dot"></span><span id="srct"></span></div>
</div>

<div class="ovl" id="ovl">
  <div class="bx">
    <h2><span class="ms">folder_open</span><span id="dh"></span></h2>
    <p id="dp"></p>
    <div class="zone" id="zone">
      <span class="ms">upload_file</span>
      <div class="z1" id="z1"></div>
      <div class="z2" id="z2"></div>
    </div>
    <input type="file" id="fi" accept=".xer,.XER" multiple hidden>
    <div class="log" id="log"></div>
    <div class="ax">
      <button class="btn sp" id="rst"><span class="ms">restart_alt</span><span id="rstt"></span></button>
      <button class="btn" id="cls"><span id="clst"></span></button>
    </div>
  </div>
</div>

<div class="kpis" id="kpis"></div>

<div class="row">
  <div class="card">
    <h3 id="h1"></h3><p class="nt" id="n1"></p>
    <button class="exp" data-c="1"><span class="ms">open_in_full</span></button>
    <div class="lg" id="lg1"></div>
    <div class="plot"><svg id="c1" role="img"></svg><div class="tip" id="t1"></div></div>
    <p class="rd" id="r1"></p>
  </div>
  <div class="card">
    <h3 id="h2"></h3><p class="nt" id="n2"></p>
    <button class="exp" data-c="2"><span class="ms">open_in_full</span></button>
    <div class="lg" id="lg2"></div>
    <div class="plot"><svg id="c2" role="img"></svg><div class="tip" id="t2"></div></div>
    <p class="rd" id="r2"></p>
  </div>
  <div class="card">
    <h3 id="h3"></h3><p class="nt" id="n3"></p>
    <button class="exp" data-c="3"><span class="ms">open_in_full</span></button>
    <div class="lg" id="lg3"></div>
    <div class="plot"><svg id="c3" role="img"></svg><div class="tip" id="t3"></div></div>
    <p class="rd" id="r3"></p>
  </div>
</div>

<div class="g2">
  <div class="card"><h3 id="h4"></h3><p class="nt" id="n4"></p><table id="mod"></table><div id="modnote"></div></div>
  <div class="card"><h3 id="h5"></h3><p class="nt" id="n5"></p><table id="chains"></table></div>
  <div class="card"><h3 id="h6"></h3><p class="nt" id="n6"></p><table id="risk"></table></div>
</div>

<div class="sec">
  <h2 id="h7"></h2>
  <p class="nt" id="n7"></p>
  <div class="cstat" id="cstat"></div>
  <div class="card" style="margin-bottom:12px;position:relative">
    <h3 id="h8"></h3><p class="nt" id="n8"></p>
    <button class="exp" data-c="4"><span class="ms">open_in_full</span></button>
    <div class="lg" id="lg4"></div>
    <div class="plot"><svg id="c4" role="img"></svg><div class="tip" id="t4"></div></div>
    <div class="rd" id="r4"></div>
  </div>
  <div class="card" style="margin-bottom:12px;position:relative">
    <h3 id="h11"></h3><p class="nt" id="n11"></p>
    <button class="exp" data-c="5"><span class="ms">open_in_full</span></button>
    <div class="lg" id="lg5"></div>
    <div class="plot"><svg id="c5" role="img"></svg><div class="tip" id="t5"></div></div>
    <p class="rd" id="r5"></p>
  </div>
  <div class="g2c">
    <div class="card" style="position:relative">
      <h3 id="h12"></h3><p class="nt" id="n12"></p>
      <button class="exp" data-c="6"><span class="ms">open_in_full</span></button>
      <div class="lg" id="lg6"></div>
      <div class="plot"><svg id="c6" role="img"></svg><div class="tip" id="t6"></div></div>
      <p class="rd" id="r6"></p>
    </div>
    <div class="card" style="position:relative">
      <h3 id="h13"></h3><p class="nt" id="n13"></p>
      <button class="exp" data-c="7"><span class="ms">open_in_full</span></button>
      <div class="plot"><svg id="c7" role="img"></svg><div class="tip" id="t7"></div></div>
      <p class="rd" id="r7"></p>
    </div>
  </div>

  <div class="g2b">
    <div class="card"><h3 id="h9"></h3><p class="nt" id="n9"></p><table id="salio"></table></div>
    <div class="card"><h3 id="h10"></h3><p class="nt" id="n10"></p><div class="lev" id="lev"></div><table id="pal"></table></div>
  </div>
</div>

":"PR-MS-800","t":"FF"},{"p":"C-01-LB-100","s":"PR-MS-800","t":"FF"},{"p":"C-01-ST-320","s":"C-01-ST-330","t":"FS"},{"p":"C-01-ST-330","s":"C-01-MP-MP-100","t":"FS"},{"p":"C-01-UC-FN-120","s":"C-01-UC-MP-140","t":"SS"},{"p":"C-01-UC-FN-130","s":"C-01-UC-FN-200","t":"FS"},{"p":"C-01-UC-MP-170","s":"C-01-UC-MP-180","t":"FS"},{"p":"C-02-C-FN-100","s":"C-02-C-FN-110","t":"FS"}],"cst":[{"code":"C-03-EX-230","name":"Install Balcony Glass Railings @ Balconies  ","de":"—","a":"CS_MSOA"},{"code":"C-08-U-FN-270","name":"Paint Drywall - Primer @ Units - L8","de":"—","a":"CS_MSOA"},{"code":"C-02-UC-MP-200","name":"Install Mech Heat Pumps & Eqp @ Units - L2","de":"—","a":"CS_MSOA"},{"code":"PR-MS-800","name":"Substantial Completion  (TCO#1) (L1 to L14) ","de":"CS_MEOB","a":"CS_MEOB"},{"code":"C-06-U-FN-290","name":"Install Vanities & Kitchen Cabinets - L6","de":"—","a":"CS_MSOA"},{"code":"C-09-U-FN-110","name":"Install Top Tracks @ Units - L9","de":"—","a":"CS_MSOA"}],"lCu":[],"lSa":[{"code":"F-10-400","name":"Fab & Deliver Shower Enclosures","tf0":-14,"tf1":31,"st1":"no"},{"code":"C-02-UC-FN-310","name":"Paint Final Coat @ Units - L2","tf0":-14,"tf1":52,"st1":"no"},{"code":"C-02-UC-FN-350","name":"Install Countertops @ Units - L2","tf0":-14,"tf1":89,"st1":"no"},{"code":"C-02-UC-FN-300","name":"Install Shower Enclosures @ B/Rs  L2","tf0":-14,"tf1":31,"st1":"no"},{"code":"C-03-U-FN-350","name":"Install Countertops @ Units - L3","tf0":-14,"tf1":34,"st1":"no"},{"code":"C-04-U-FN-350","name":"Install Countertops @ Units - L4","tf0":-14,"tf1":34,"st1":"no"},{"code":"C-05-U-FN-350","name":"Install Countertops @ Units - L5","tf0":-14,"tf1":33,"st1":"no"},{"code":"C-06-U-FN-350","name":"Install Countertops @ Units - L6","tf0":-14,"tf1":30,"st1":"no"},{"code":"C-07-U-FN-350","name":"Install Countertops @ Units - L7","tf0":-14,"tf1":27,"st1":"no"},{"code":"C-07-U-FN-370","name":"Install SPC Flooring @ Units - L7","tf0":-14,"tf1":79,"st1":"no"}],"lSi":[],"cProm":44,"cCump":28,"cPpc":63.6," <script>
(function(){
/* Datos: el tablero trae 12 versiones incorporadas; si el usuario cargó archivos
   en una visita anterior se reemplazan por el resultado guardado (métricas, no archivos). */
var EMB=JSON.parse(document.getElementById('data').textContent);
var D=EMB, SRC=null, RAW=null;
try{var sj=localStorage.getItem('domus_data');
  if(sj){var so=JSON.parse(sj);
    if(so&&so.d&&so.d.length){D=so.d;SRC=so.s||{n:so.d.length,when:''}}}}catch(e){}

/* ═══ Lectura de .xer en el navegador ═══
   Replica el cálculo verificado contra las 12 versiones del análisis forense. */
function parseXer(text){
  var tables={},cur=null,cols=null,rows=null;
  var lines=text.split('\n');
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(!line)continue;
    if(line.charCodeAt(line.length-1)===13)line=line.slice(0,-1);
    if(!line)continue;
    var p=line.split('\t');
    if(p[0]==='%T'){
      if(cur&&cols)tables[cur]={cols:cols,rows:rows,idx:colIdx(cols)};
      cur=p[1];cols=null;rows=[];
    } else if(p[0]==='%F'){ cols=p.slice(1);
    } else if(p[0]==='%R'&&cols){
      var v=p.slice(1);
      if(v.length<cols.length){while(v.length<cols.length)v.push('')}
      else if(v.length>cols.length)v=v.slice(0,cols.length);
      rows.push(v);
    }
  }
  if(cur&&cols)tables[cur]={cols:cols,rows:rows,idx:colIdx(cols)};
  return tables;
}
function colIdx(cols){var m={};for(var i=0;i<cols.length;i++)m[cols[i]]=i;return m}
function pdt(s){
  if(!s)return null;
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:\s+(\d{2}):(\d{2}))?/);
  if(!m)return null;
  return new Date(+m[1],+m[2]-1,+m[3],m[4]?+m[4]:0,m[5]?+m[5]:0);
}
function isod(d){ if(!d)return null;
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function nmv(s){ if(s===''||s===null||s===undefined)return null; var v=parseFloat(s); return isNaN(v)?null:v}
function r2(v){ return v===null?null:Math.round(v*100)/100 }

var MSDEF=[['PR-MS-200','ms1','2027-08-21'],['PR-MS-300','ms2','2027-10-21'],
           ['PR-MS-400','ms3','2027-12-21'],['PR-MS-800','tco','2028-03-21'],
           ['PR-MS-900','co','2028-05-22']];

/* la etiqueta sale del nombre del archivo: proj_short_name viene truncado en algunas versiones */
var MESC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function vlabel(fileName,shortName,dd){
  var m=fileName.match(/upd[^0-9]{0,4}(\d{1,2})/i);
  if(m)return 'U'+String(+m[1]).padStart(2,'0');
  m=(shortName||'').match(/upd\s*(\d{1,2})/i);
  if(m)return 'U'+String(+m[1]).padStart(2,'0');
  if(/baseline/i.test(fileName)){
    var v=fileName.match(/v?(\d+[._]\d+[a-z]?)/i);
    return 'BL'+(v?' '+v[1].replace('_','.'):'');
  }
  if(/phased/i.test(fileName))return 'Fásico';
  /* el CMAR cambió la convención de nombres: sin número de update, la data date
     es la etiqueta honesta y siempre ordena bien */
  if(dd)return MESC[dd.getMonth()]+'-'+String(dd.getFullYear()).slice(2);
  return (shortName||fileName).replace(/\.xer$/i,'').replace(/^.*?[-_]/,'').slice(0,12);
}

function readVersion(text,fileName){
  var t=parseXer(text);
  var TK=t.TASK, PJ=t.PROJECT, TP=t.TASKPRED;
  if(!TK||!PJ||!PJ.rows.length)throw new Error('sin tablas TASK / PROJECT');
  var pi=PJ.idx, prow=PJ.rows[0];
  var dd=pdt(prow[pi.last_recalc_date]);
  if(!dd)throw new Error('sin data date (last_recalc_date)');
  var short=prow[pi.proj_short_name]||'';

  /* ruta WBS completa, subiendo por la cadena de padres */
  var wn={},wp={},wpath={};
  if(t.PROJWBS){var w=t.PROJWBS.idx;
    t.PROJWBS.rows.forEach(function(r){wn[r[w.wbs_id]]=r[w.wbs_name];wp[r[w.wbs_id]]=r[w.parent_wbs_id]})}
  function wpathOf(id,d){
    if(wpath[id]!==undefined)return wpath[id];
    if(!(id in wn)||(d||0)>25)return '';
    var p=wp[id], r=(p&&p!==id&&(p in wn))?wpathOf(p,(d||0)+1)+' / '+wn[id]:wn[id];
    wpath[id]=r;return r;
  }
  var cal={};
  if(t.CALENDAR){var cz=t.CALENDAR.idx;
    t.CALENDAR.rows.forEach(function(r){cal[r[cz.clndr_id]]=r[cz.clndr_name]})}

  var x=TK.idx;
  var acts=[],byCode={},rel=[],idCode={};
  for(var i=0;i<TK.rows.length;i++){
    var r=TK.rows[i];
    var a={id:r[x.task_id],code:r[x.task_code],name:r[x.task_name],
      st:r[x.status_code],type:r[x.task_type],
      wbs:wpathOf(r[x.wbs_id]),cal:cal[r[x.clndr_id]]||'',
      tf:nmv(r[x.total_float_hr_cnt]),ff:nmv(r[x.free_float_hr_cnt]),
      td:nmv(r[x.target_drtn_hr_cnt]),rd:nmv(r[x.remain_drtn_hr_cnt]),
      pc:nmv(r[x.phys_complete_pct]),
      ee:pdt(r[x.early_end_date]),es:pdt(r[x.early_start_date]),
      lf:pdt(r[x.late_end_date]),ls:pdt(r[x.late_start_date]),
      ae:pdt(r[x.act_end_date]),as_:pdt(r[x.act_start_date]),
      ct:r[x.cstr_type]||'',cd:pdt(r[x.cstr_date]),
      fp:r[x.float_path]||'',dpf:r[x.driving_path_flag]||''};
    a.cs=a.ct+'|'+(r[x.cstr_date]||'');
    a.tfd=a.tf===null?null:a.tf/8;
    acts.push(a);byCode[a.code]=a;idCode[a.id]=a.code;
  }
  if(TP){var y=TP.idx;
    for(var j=0;j<TP.rows.length;j++){var q=TP.rows[j];
      rel.push({p:idCode[q[y.pred_task_id]],s:idCode[q[y.task_id]],
                t:q[y.pred_type],lag:nmv(q[y.lag_hr_cnt])})}}
  return {id:vlabel(fileName,short,dd),file:fileName,dd:dd,short:short,
          acts:acts,byCode:byCode,rel:rel};
}
function relKey(r){return r.p+'>'+r.s+'>'+r.t}

function metrics(V,PV){
  var acts=V.acts,dd=V.dd;
  var pend=acts.filter(function(a){return a.st!=='TK_Complete'});
  var done=acts.filter(function(a){return a.st==='TK_Complete'});
  var o={id:V.id,dd:isod(dd),nAct:acts.length,nRel:V.rel.length,
         done:done.length,pend:pend.length,
         neg:pend.filter(function(a){return a.tfd!==null&&a.tfd<0}).length};

  o.ms=MSDEF.map(function(m){
    var a=V.byCode[m[0]];
    return {code:m[0],k:m[1],ctr:m[2],tf:a?r2(a.tfd):null,fc:a?isod(a.ee):null}});

  /* bandas de holgura: actividades que se mueven juntas */
  var band={};
  pend.forEach(function(a){ if(a.tfd===null)return;
    var v=Math.round(a.tfd*100)/100;
    (band[v]=band[v]||[]).push(a)});
  var keys=Object.keys(band).map(Number).sort(function(a,b){return a-b});
  o.ch5=0;o.ch5act=0;
  keys.forEach(function(v){ if(v<=5&&band[v].length>=5){o.ch5++;o.ch5act+=band[v].length}});
  o.chains=[];
  for(var i=0;i<keys.length&&o.chains.length<5;i++){
    var v=keys[i]; if(v>12||band[v].length<5)continue;
    var g=band[v].slice().sort(function(a,b){return (a.ee||0)-(b.ee||0)});
    o.chains.push({tf:v,n:band[v].length,code:g[0].code,name:(g[0].name||'').slice(0,52)});
  }

  o.risk=acts.filter(function(a){return a.st==='TK_Active'})
    .sort(function(a,b){return (a.tfd===null?9e9:a.tfd)-(b.tfd===null?9e9:b.tfd)})
    .slice(0,4).map(function(a){return {code:a.code,name:(a.name||'').slice(0,46),
      lf:isod(a.lf),tf:r2(a.tfd)}});

  var rm={},pm={};
  done.forEach(function(a){ if(!a.ae)return; var k=ymd(a.ae); rm[k]=(rm[k]||0)+1});
  var ddm=ymd(dd);
  pend.forEach(function(a){ if(!a.ee)return; var k=ymd(a.ee); if(k<=ddm)return; pm[k]=(pm[k]||0)+1});
  var rk=Object.keys(rm).sort(), pk=Object.keys(pm).sort().slice(0,12);
  o.realLab=rk; o.real=rk.map(function(k){return rm[k]});
  o.planLab=pk; o.plan=pk.map(function(k){return pm[k]});

  if(PV){
    var durCh=0;
    acts.forEach(function(a){var b=PV.byCode[a.code];
      if(b&&b.td!==null&&a.td!==null&&b.td!==a.td)durCh++});
    o.dur=durCh;
    var sa={},sb={};
    PV.rel.forEach(function(r){sa[relKey(r)]=1}); V.rel.forEach(function(r){sb[relKey(r)]=1});
    o.relDel=Object.keys(sa).filter(function(r){return !sb[r]}).length;
    o.relAdd=Object.keys(sb).filter(function(r){return !sa[r]}).length;
    var cs=0;
    acts.forEach(function(a){var b=PV.byCode[a.code]; if(b&&b.cs!==a.cs)cs++});
    o.cstr=cs;
    o.actAdd=acts.filter(function(a){return !PV.byCode[a.code]}).length;
    /* cumplimiento: lo que la versión anterior prometía para este periodo,
       cruzado por código contra lo que efectivamente cerró dentro del periodo */
    var dp=PV.dd, prom={},np=0;
    PV.acts.forEach(function(a){
      if(a.st!=='TK_Complete'&&a.ee&&a.ee<=dd){prom[a.code]=1;np++}});
    var term=[],cump=0;
    acts.forEach(function(a){
      if(a.st==='TK_Complete'&&a.ae&&a.ae>dp&&a.ae<=dd){
        term.push(a.code); if(prom[a.code])cump++}});
    o.prom=np; o.cump=cump; o.perDone=term.length;
    o.fuera=term.filter(function(c){return !prom[c]}).length;
    o.ppc=np?Math.round(1000*cump/np)/10:null;
  } else {
    o.dur=null;o.relDel=null;o.relAdd=null;o.cstr=null;o.actAdd=null;
    o.prom=null;o.cump=null;o.perDone=null;o.fuera=null;o.ppc=null;
  }
  return o;
}

/* ═══ Actividades críticas: mismo cálculo que el análisis forense ═══
   Críticas = pendientes de trabajo con holgura ≤ 0 en la versión anterior.
   Se las sigue por código y se clasifica su destino; luego se mide cuántas de
   las que salieron de criticidad están aguas abajo de lo que cambió. */
var WORK={TT_Task:1,TT_Rsrc:1};

function critical(V,PV){
  var o={nCrit:null,cu:null,sa:null,si:null,bo:null,pcu:null,psa:null,aguas:null,
         dur:null,add:null,'del':null,cst:null,lCu:null,lSa:null,lSi:null,
         cProm:null,cCump:null,cPpc:null,c0Prom:null,c0Cump:null,c0Ppc:null,
         S1:null,en:null,enNue:null,enCru:null,nDur:null,nAdd:null,nDel:null,nCst:null};
  if(!PV)return o;
  var crit=PV.acts.filter(function(a){
    return a.st!=='TK_Complete'&&WORK[a.type]&&a.tfd!==null&&a.tfd<=0});
  var cu=[],sa=[],si=[],bo=0;
  crit.forEach(function(a){
    var n=V.byCode[a.code];
    if(!n){bo++;return}
    var rec={code:a.code,name:(n.name||'').slice(0,54),
      tf0:r2(a.tfd),tf1:(n.tfd===null?null:r2(n.tfd)),
      st1:(n.st==='TK_NotStart'?'no':n.st==='TK_Active'?'curso':'fin')};
    if(n.st==='TK_Complete')cu.push(rec);
    else if(n.tfd!==null&&n.tfd>0)sa.push(rec);
    else si.push(rec);
  });
  /* cambios al modelo del periodo */
  var dur=[],cst=[];
  V.acts.forEach(function(a){
    var b=PV.byCode[a.code]; if(!b)return;
    if(b.td!==null&&a.td!==null&&b.td!==a.td)
      dur.push({code:a.code,name:(a.name||'').slice(0,44),de:r2(b.td/8),a:r2(a.td/8)});
    if(b.cs!==a.cs)
      cst.push({code:a.code,name:(a.name||'').slice(0,44),de:(b.ct||'—'),a:(a.ct||'—')});
  });
  var was={},now={};
  PV.rel.forEach(function(r){was[relKey(r)]=r}); V.rel.forEach(function(r){now[relKey(r)]=r});
  var add=[],del_=[];
  Object.keys(now).sort().forEach(function(k){if(!was[k])add.push(now[k])});
  Object.keys(was).sort().forEach(function(k){if(!now[k])del_.push(was[k])});

  /* alcance: aguas abajo de lo que cambió, y aguas arriba de un hito cuya
     restricción se movió (quitarle el ancla libera a todo lo que lo alimenta) */
  var seeds={},msSeeds={};
  dur.forEach(function(x){seeds[x.code]=1});
  add.concat(del_).forEach(function(r){seeds[r.p]=1});
  cst.forEach(function(x){ if(/^PR-MS-/.test(x.code))msSeeds[x.code]=1 });
  var fwd={},rev={};
  PV.rel.forEach(function(r){
    (fwd[r.p]=fwd[r.p]||[]).push(r.s); (rev[r.s]=rev[r.s]||[]).push(r.p)});
  function walk(start,g){
    var seen={},q=Object.keys(start);
    while(q.length){var x=q.shift(),nx=g[x]||[];
      for(var i=0;i<nx.length;i++){ if(!seen[nx[i]]){seen[nx[i]]=1;q.push(nx[i])} }}
    return seen;
  }
  var alc=walk(seeds,fwd), up=walk(msSeeds,rev);
  Object.keys(up).forEach(function(k){alc[k]=1});
  var hit=sa.filter(function(r){return alc[r.code]}).length;

  /* PPC restringido: de lo comprometido para el periodo, sólo lo crítico o casi
     crítico (holgura ≤ 5 d). Mismo criterio de cumplimiento que el PPC general. */
  function ppcAt(thr){
    var prom={},np=0;
    PV.acts.forEach(function(a){
      if(a.st!=='TK_Complete'&&WORK[a.type]&&a.ee&&a.ee<=V.dd&&
         a.tfd!==null&&a.tfd<=thr){prom[a.code]=1;np++}});
    var cm=0;
    V.acts.forEach(function(a){
      if(a.st==='TK_Complete'&&a.ae&&a.ae>PV.dd&&a.ae<=V.dd&&prom[a.code])cm++});
    return {prom:np,cump:cm,ppc:(np?Math.round(1000*cm/np)/10:null)};
  }
  var q5=ppcAt(5), q0=ppcAt(0);
  o.cProm=q5.prom; o.cCump=q5.cump; o.cPpc=q5.ppc;
  o.c0Prom=q0.prom; o.c0Cump=q0.cump; o.c0Ppc=q0.ppc;

  /* saldo: lo que entra a criticidad cierra la ecuación
     S0 − cumplidas − salieron − borradas + entraron = S1 */
  var wasCrit={}; crit.forEach(function(a){wasCrit[a.code]=1});
  var S1=0,en=0,enNue=0;
  V.acts.forEach(function(a){
    if(a.st==='TK_Complete'||!WORK[a.type]||a.tfd===null||a.tfd>0)return;
    S1++;
    if(!wasCrit[a.code]){en++; if(!PV.byCode[a.code])enNue++}});
  o.S1=S1; o.en=en; o.enNue=enNue; o.enCru=en-enNue;
  o.nDur=dur.length; o.nAdd=add.length; o.nDel=del_.length; o.nCst=cst.length;

  var n=crit.length;
  o.nCrit=n; o.cu=cu.length; o.sa=sa.length; o.si=si.length; o.bo=bo;
  o.pcu=n?Math.round(1000*cu.length/n)/10:0;
  o.psa=n?Math.round(1000*sa.length/n)/10:0;
  o.aguas=sa.length?Math.round(1000*hit/sa.length)/10:null;
  var byTf=function(x,y){return x.tf0-y.tf0};
  o.dur=dur.slice(0,6); o.cst=cst.slice(0,6);
  o.add=add.slice(0,8).map(function(r){return {p:r.p,s:r.s,t:r.t.replace('PR_','')}});
  o['del']=del_.slice(0,8).map(function(r){return {p:r.p,s:r.s,t:r.t.replace('PR_','')}});
  o.lCu=cu.sort(byTf).slice(0,8); o.lSa=sa.sort(byTf).slice(0,10); o.lSi=si.sort(byTf).slice(0,10);
  return o;
}

function buildDataset(versions){
  versions.sort(function(a,b){return a.dd-b.dd});
  var out=[];
  for(var i=0;i<versions.length;i++){
    var pv=i?versions[i-1]:null;
    var m=metrics(versions[i],pv), cr=critical(versions[i],pv);
    for(var k in cr) m[k]=cr[k];
    out.push(m);
  }
  return out;
}

function txt(x,y,s,o){o=o||{};var t=E('text',{x:x,y:y,fill:o.fill||cs('--ink3'),'font-size':o.sz||9.5,
  'font-family':o.mono?'Roboto Mono, monospace':'Roboto, sans-serif','text-anchor':o.an||'middle','font-weight':400});
  t.textContent=s;return t}
function clear(id){var s=document.getElementById(id);while(s.firstChild)s.removeChild(s.firstChild);return s}
var BIG={};
/* c4 y c5 ocupan el ancho completo, así que su lienzo base ya es ancho:
   con el viewBox chico se estiraban y la tipografía salía desproporcionada */
var WIDE={c4:1,c5:1,c6:1,c7:1};
function dm(id){var b=!!BIG[id],w=!!WIDE[id];
  var W=(b||w)?980:480, H=b?(w?420:360):(w?290:190),
      Lm=(b||w)?46:34, R=(b||w)?14:8, T=(b||w)?14:10, B=(b||w)?36:26;
  return {W:W,H:H,L:Lm,R:R,T:T,B:B,iw:W-Lm-R,ih:H-T-B,big:b||w}}

function hook(svg,tip,n,xf,build,d){
  var W=d.W,H=d.H,T=d.T,ih=d.ih;
  var hot=E('rect',{x:0,y:0,width:W,height:H,fill:'transparent'});svg.appendChild(hot);
  var mk=E('line',{x1:0,y1:T,x2:0,y2:T+ih,stroke:cs('--line2'),'stroke-width':1,opacity:0});svg.appendChild(mk);
  function move(ev){
    var r=svg.getBoundingClientRect();
    var cx=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width*W;
    var best=0,bd=1e9;
    for(var i=0;i<n;i++){var q=Math.abs(xf(i)-cx);if(q<bd){bd=q;best=i}}
    mk.setAttribute('x1',xf(best));mk.setAttribute('x2',xf(best));mk.setAttribute('opacity','1');
    tip.innerHTML=build(best);tip.classList.add('on');
    var px=xf(best)/W*r.width;
    tip.style.left=Math.max(4,Math.min(r.width-tip.offsetWidth-4,px-tip.offsetWidth/2))+'px';
    tip.style.top='2px';
  }
  function out(){mk.setAttribute('opacity','0');tip.classList.remove('on')}
  svg.addEventListener('mousemove',move);svg.addEventListener('mouseleave',out);
  svg.addEventListener('touchstart',move,{passive:true});
  svg.addEventListener('touchmove',move,{passive:true});svg.addEventListener('touchend',out);
}

function chart1(idx){
  var d=dm('c1'),W=d.W,H=d.H,Lm=d.L,T=d.T,iw=d.iw,ih=d.ih;
  var s=clear('c1');s.setAttribute('viewBox','0 0 '+W+' '+H);
  var lab=D.map(function(o){return o.id==='BL 1.0a'?'BL':o.id.replace('U','')});
  var g2=D.map(function(o){return o.ms[1].tf}),g3=D.map(function(o){return o.ms[2].tf}),gt=D.map(function(o){return o.ms[3].tf});
  var all=g2.concat(g3,gt).filter(function(v){return v!==null});
  var hi=Math.max(80,Math.ceil(Math.max.apply(null,all)/10)*10), lo=Math.min(-55,Math.floor(Math.min.apply(null,all)/10)*10);
  function X(i){return Lm+iw*i/(lab.length-1)} function Y(v){return T+ih*(hi-v)/(hi-lo)}
  [hi,Math.round((hi+lo)/2/10)*10,0,lo].forEach(function(v){
    s.appendChild(E('line',{x1:Lm,y1:Y(v),x2:Lm+iw,y2:Y(v),stroke:v===0?cs('--line2'):cs('--grid'),'stroke-width':v===0?1.2:1}));
    s.appendChild(txt(Lm-6,Y(v)+3.2,v,{an:'end',mono:1,sz:d.big?11:9.5}))});
  [[g2,C.ms2],[g3,C.ms3],[gt,C.tco]].forEach(function(p){
    var pd=p[0].map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)}).join(' ');
    s.appendChild(E('path',{d:pd,fill:'none',stroke:p[1],'stroke-width':d.big?2.6:1.9,'stroke-linejoin':'round','stroke-linecap':'round'}));
    p[0].forEach(function(v,i){
      if(d.big)s.appendChild(E('circle',{cx:X(i),cy:Y(v),r:2.6,fill:p[1]}));
      if(i===idx)s.appendChild(E('circle',{cx:X(i),cy:Y(v),r:d.big?5:3.6,fill:p[1],stroke:cs('--surface'),'stroke-width':d.big?2.2:1.6}))})});
  lab.forEach(function(t,i){s.appendChild(txt(X(i),H-(d.big?13:9),t,{mono:1,sz:d.big?11:9,fill:i===idx?cs('--acc'):cs('--ink3')}))});
  hook(s,document.getElementById('t1'),lab.length,X,function(i){
    return '<div class="th">'+D[i].id+' · '+fd(D[i].dd)+'</div>'+
      '<i style="background:'+C.ms2+'"></i>'+L().ms2.split('·')[0].trim()+'  '+fmt(g2[i],' d')+'<br>'+
      '<i style="background:'+C.ms3+'"></i>'+L().ms3.split('·')[0].trim()+'  '+fmt(g3[i],' d')+'<br>'+
      '<i style="background:'+C.tco+'"></i>'+L().lgTco+'  '+fmt(gt[i],' d')},d);
}

function chart2(idx){
  var d=dm('c2'),W=d.W,H=d.H,Lm=d.L,T=d.T,iw=d.iw,ih=d.ih;
  var o=D[idx],s=clear('c2');s.setAttribute('viewBox','0 0 '+W+' '+H);
  var real=o.real,plan=o.plan,rl=o.realLab,pl=o.planLab;
  var all=real.concat(plan),n=all.length;
  var hi=Math.max(10,Math.ceil(Math.max.apply(null,all.concat([10]))/50)*50);
  var gap=iw/Math.max(n,1),bw=gap*0.74;
  function Y(v){return T+ih*(1-v/hi)} function X(i){return Lm+gap*i+gap/2}
  [hi,hi*0.75,hi*0.5,hi*0.25,0].forEach(function(v){
    s.appendChild(E('line',{x1:Lm,y1:Y(v),x2:Lm+iw,y2:Y(v),stroke:v===0?cs('--line2'):cs('--grid'),'stroke-width':v===0?1.2:1}));
    s.appendChild(txt(Lm-6,Y(v)+3.2,Math.round(v),{an:'end',mono:1,sz:d.big?11:9.5}))});
  all.forEach(function(v,i){
    s.appendChild(E('rect',{x:(Lm+gap*i+(gap-bw)/2).toFixed(1),y:Y(v).toFixed(1),width:Math.max(1.2,bw).toFixed(1),
      height:Math.max(1,ih-(Y(v)-T)).toFixed(1),fill:i<real.length?C.real:C.plan,rx:1.5}))});
  if(real.length&&plan.length){var xs=Lm+gap*real.length;
    s.appendChild(E('line',{x1:xs,y1:T,x2:xs,y2:T+ih,stroke:cs('--line2'),'stroke-width':1,'stroke-dasharray':'3 3'}))}
  if(d.big)all.forEach(function(v,i){
    s.appendChild(txt(X(i),H-20,fm(i<real.length?rl[i]:pl[i-real.length]),{mono:1,sz:9.5}));
    s.appendChild(txt(X(i),Y(v)-5,v,{mono:1,sz:9.5,fill:cs('--ink2')}))});
  if(real.length)s.appendChild(txt(Lm+gap*real.length/2,H-(d.big?6:9),L().real,{sz:d.big?11:9.5}));
  if(plan.length)s.appendChild(txt(Lm+gap*(real.length+plan.length/2),H-(d.big?6:9),L().plan,{sz:d.big?11:9.5}));
  hook(s,document.getElementById('t2'),n,X,function(i){
    var isR=i<real.length;
    return '<div class="th">'+fm(isR?rl[i]:pl[i-real.length])+'</div>'+
      '<i style="background:'+(isR?C.real:C.plan)+'"></i>'+(isR?L().tReal:L().tPlan)+'  '+all[i]},d);
}

function chart3(idx){

  var s=clear('c3');s.setAttribute('viewBox','0 0 '+W+' '+H);

  function Y(v){return T+ih*(1-v/hi)} function X(i){return Lm+gap*i+gap/2}
  [hi,hi*0.66,hi*0.33,0].forEach(function(v){
    s.appendChild(E('line',{x1:Lm,y1:Y(v),x2:Lm+iw,y2:Y(v),stroke:v===0?cs('--line2'):cs('--grid'),'stroke-width':v===0?1.2:1}));
    s.appendChild(txt(Lm-6,Y(v)+3.2,Math.round(v)+'%',{an:'end',mono:1,sz:d.big?11:9.5}))});
  var avg=pts.reduce(function(a,b){return a+b},0)/n;

/* barras apiladas: destino de las críticas de cada periodo */
function chart4(idx){
  var d=dm('c4'),W=d.W,H=d.H,Lm=d.L,T=d.T,iw=d.iw,ih=d.ih;
  var s=clear('c4');s.setAttribute('viewBox','0 0 '+W+' '+H);
  var lab=[],st=[];
  for(var i=0;i<=idx;i++){var o=D[i];
    if(o.nCrit===null||o.nCrit===undefined||!o.nCrit)continue;
    lab.push(o);st.push([o.cu,o.sa,o.si])}
  if(!st.length){s.appendChild(txt(W/2,H/2,L().sinCrit,{sz:11}));
    document.getElementById('r4').textContent='';return}
  var hi=Math.max.apply(null,st.map(function(a){return a[0]+a[1]+a[2]}));
  hi=Math.ceil(hi/100)*100||100;
  var n=st.length,gap=iw/n,bw=Math.min(gap*0.62,d.big?44:22);
  function Y(v){return T+ih*(1-v/hi)} function X(i){return Lm+gap*i+gap/2}
  [hi,hi*0.5,0].forEach(function(v){
    s.appendChild(E('line',{x1:Lm,y1:Y(v),x2:Lm+iw,y2:Y(v),
      stroke:v===0?cs('--line2'):cs('--grid'),'stroke-width':v===0?1.2:1}));
    s.appendChild(txt(Lm-6,Y(v)+3.2,Math.round(v),{an:'end',mono:1,sz:d.big?11:9.5}))});
  st.forEach(function(a,i){
    var acc=0, x=X(i)-bw/2, saY=null, saH=0;
    [[a[2],C.si],[a[1],C.sa],[a[0],C.cu]].forEach(function(pr,j){
      if(!pr[0])return;
      var h=ih*pr[0]/hi;
      s.appendChild(E('rect',{x:x.toFixed(1),y:(T+ih-acc-h).toFixed(1),
        width:bw.toFixed(1),height:Math.max(1,h).toFixed(1),fill:pr[1],rx:1.5}));
      if(j===1){saY=T+ih-acc-h;saH=h}
      acc+=h});
    /* la cifra sólo cabe dentro del segmento rojo si el segmento es alto */
    if(d.big&&a[1]&&saH>=16)
      s.appendChild(txt(X(i),saY+saH/2+3.5,a[1],{mono:1,sz:10,fill:'#fff'}))});
  lab.forEach(function(o,i){
    s.appendChild(txt(X(i),H-(d.big?13:9),d.big?fd(o.dd):o.id.replace('U',''),
      {mono:1,sz:d.big?10:9}))});
  hook(s,document.getElementById('t4'),n,X,function(i){
    var o=lab[i],a=st[i],t=L();
    return '<div class="th">'+o.id+' · '+fd(o.dd)+'</div>'+
      '<i style="background:'+C.cu+'"></i>'+a[0]+'  '+t.tCu+'<br>'+
      '<i style="background:'+C.sa+'"></i>'+a[1]+'  '+t.tSa+'<br>'+
      '<i style="background:'+C.si+'"></i>'+a[2]+'  '+t.tSi},d);
  var tc=0,ts=0;
  D.forEach(function(o){if(o.nCrit){tc+=o.cu;ts+=o.sa}});
  document.getElementById('r4').innerHTML=L().r4(tc,ts);
}

        : o.cPpc.toFixed(1)+'%  '+t.tCrit+' ('+t.deComp(o.cCump,o.cProm)+')')},d);

}

/* acumulado: PPC corrido desde el inicio, crítico contra total */
function chart6(idx){
  var d=dm('c6'),W=d.W,H=d.H,Lm=d.L,T=d.T,iw=d.iw,ih=d.ih;
  var sv=clear('c6');sv.setAttribute('viewBox','0 0 '+W+' '+H);
  var lab=[],ac=[],ag=[],sc=0,scp=0,sg=0,sgp=0;
  for(var i=1;i<=idx;i++){var o=D[i];
    if(o.prom===null||o.prom===undefined)continue;
    sg+=o.cump;sgp+=o.prom;
    if(o.cProm){sc+=o.cCump;scp+=o.cProm}
    lab.push(o);ag.push(sgp?100*sg/sgp:null);ac.push(scp?100*sc/scp:null)}
  if(!lab.length){sv.appendChild(txt(W/2,H/2,L().sinPer,{sz:11}));
    document.getElementById('r6').textContent='';return}
  var n=lab.length;
  function Y(v){return T+ih*(1-v/100)} function X(i){return n<2?Lm+iw/2:Lm+iw*i/(n-1)}
  [100,50,0].forEach(function(v){
    sv.appendChild(E('line',{x1:Lm,y1:Y(v),x2:Lm+iw,y2:Y(v),
      stroke:v===0?cs('--line2'):cs('--grid'),'stroke-width':v===0?1.2:1}));
    sv.appendChild(txt(Lm-6,Y(v)+3.2,v+'%',{an:'end',mono:1,sz:d.big?11:9.5}))});
  function line(arr,col){
    var p='',k=0;
    arr.forEach(function(v,i){ if(v===null)return; p+=(k++?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)});
    if(p)sv.appendChild(E('path',{d:p,fill:'none',stroke:col,'stroke-width':2,
      'stroke-linejoin':'round','stroke-linecap':'round'}));
    arr.forEach(function(v,i){ if(v===null)return;
      sv.appendChild(E('circle',{cx:X(i).toFixed(1),cy:Y(v).toFixed(1),r:2.4,fill:col}))});
  }
  line(ag,C.ppcG); line(ac,C.ppcC);
  lab.forEach(function(o,i){
    if(!d.big&&n>7&&i%2)return;
    sv.appendChild(txt(X(i),H-(d.big?13:9),d.big?fd(o.dd):o.id.replace('U',''),
      {mono:1,sz:d.big?10:9}))});
  hook(sv,document.getElementById('t6'),n,X,function(i){
    var o=lab[i],t=L();
    return '<div class="th">'+o.id+' · '+fd(o.dd)+'</div>'+
      '<i style="background:'+C.ppcG+'"></i>'+(ag[i]===null?'—':ag[i].toFixed(1)+'%')+'  '+t.lgAcG+'<br>'+
      '<i style="background:'+C.ppcC+'"></i>'+(ac[i]===null?'—':ac[i].toFixed(1)+'%')+'  '+t.lgAcC},d);
  document.getElementById('r6').innerHTML=L().r6(
    (ac[n-1]===null?'—':ac[n-1].toFixed(0)),(ag[n-1]===null?'—':ag[n-1].toFixed(0)),scp,sgp);
}

/* cascada: cómo se mueve el stock de críticas en el periodo */
function chart7(idx){
  var d=dm('c7'),W=d.W,H=d.H,Lm=d.L,T=d.T,iw=d.iw,ih=d.ih;
  var sv=clear('c7');sv.setAttribute('viewBox','0 0 '+W+' '+H);
  var o=D[idx],t=L();
  if(o.nCrit===null||o.nCrit===undefined){
    sv.appendChild(txt(W/2,H/2,t.sinCrit,{sz:11}));
    document.getElementById('r7').textContent='';return}
  var steps=[{k:t.wS0,v:o.nCrit,tot:1,c:C.si},
             {k:t.wCu,v:-o.cu,c:C.cu},{k:t.wSa,v:-o.sa,c:C.sa}];
  if(o.bo)steps.push({k:t.wBo,v:-o.bo,c:C.sal});
  steps.push({k:t.wEn,v:o.en,c:C.en},{k:t.wS1,v:o.S1,tot:1,c:C.si});
  var run=0,hi=0;
  steps.forEach(function(x){ if(x.tot){hi=Math.max(hi,x.v);run=x.v}
    else {hi=Math.max(hi,run,run+x.v);run+=x.v}});
  hi=hi||1;
  var n=steps.length,gap=iw/n,bw=Math.min(gap*0.56,d.big?52:26);
  function Y(v){return T+ih*(1-v/hi)} function X(i){return Lm+gap*i+gap/2}
  sv.appendChild(E('line',{x1:Lm,y1:T+ih,x2:Lm+iw,y2:T+ih,stroke:cs('--line2'),'stroke-width':1.2}));
  run=0; var prevTop=null;
  steps.forEach(function(x,i){
    var lo,hiv;
    if(x.tot){lo=0;hiv=x.v;run=x.v} else { if(x.v>=0){lo=run;hiv=run+x.v} else {lo=run+x.v;hiv=run} run+=x.v }
    var y=Y(hiv),h=Math.max(1.5,Y(lo)-Y(hiv));
    sv.appendChild(E('rect',{x:(X(i)-bw/2).toFixed(1),y:y.toFixed(1),
      width:bw.toFixed(1),height:h.toFixed(1),fill:x.c,rx:1.5}));
    if(prevTop!==null)sv.appendChild(E('line',{x1:(X(i-1)+bw/2).toFixed(1),y1:prevTop.toFixed(1),
      x2:(X(i)-bw/2).toFixed(1),y2:prevTop.toFixed(1),stroke:cs('--line2'),
      'stroke-width':1,'stroke-dasharray':'2,2'}));
    prevTop=Y(run);
    var v=x.tot?x.v:x.v;
    sv.appendChild(txt(X(i),y-5,(x.tot?'':(v>0?'+':''))+v,{mono:1,sz:d.big?11:9,
      fill:x.tot?cs('--ink2'):x.c}));
    sv.appendChild(txt(X(i),H-(d.big?13:9),x.k,{sz:d.big?10:8.5,fill:cs('--ink3')}));
  });
  document.getElementById('r7').innerHTML=(o.sa||o.en)?t.r7(o.sa,o.en,o.cu):t.r7cero;
}

function readFile(f){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onerror=function(){rej(new Error('no se pudo leer el archivo'))};
    r.onload=function(){
      try{res(new TextDecoder('windows-1252').decode(r.result))}
      catch(e){res(new TextDecoder('iso-8859-1').decode(r.result))}};
    r.readAsArrayBuffer(f)})
}

function load(fl){
  var t=L(), files=Array.prototype.slice.call(fl)
    .filter(function(f){return /\.xer$/i.test(f.name)});
  if(!files.length){say(t.lgNone,'er');return}
  var V=[], i=0;
  (function step(){
    if(i>=files.length)return done();
    var f=files[i];
    say(t.lgRead(i+1,files.length,f.name));
    readFile(f).then(function(txt){
      try{var v=readVersion(txt,f.name);V.push(v);
        logb.lastChild.className='ok';
        logb.lastChild.textContent=t.lgOk(v.id,v.dd.toISOString().slice(0,10),
          v.acts.length.toLocaleString(lang));
      }catch(e){logb.lastChild.className='er';
        logb.lastChild.textContent=t.lgEr(f.name,e.message)}
      i++;setTimeout(step,0);
    }).catch(function(e){logb.lastChild.className='er';
      logb.lastChild.textContent=t.lgEr(f.name,e.message);i++;setTimeout(step,0)});
  })();

  function done(){
    if(!V.length){say(t.lgNone,'er');return}
    /* una etiqueta repetida se resuelve por data date: gana la más reciente */
    var seen={},keep=[];
    V.sort(function(a,b){return b.dd-a.dd});
    V.forEach(function(v){if(seen[v.id]){say(t.lgDup(v.id),'er');return}seen[v.id]=1;keep.push(v)});
    var ds=buildDataset(keep);
    RAW=keep;   /* el grano fino queda en memoria para la exportación completa */
    if(!ds.some(function(o){return o.ms.some(function(m){return m.tf!==null})}))say(t.lgNoMs,'er');
    if(ds.length===1)say(t.lgOne,'er');
    D=ds;
    SRC={n:ds.length,when:new Date().toLocaleDateString(lang==='es'?'es':'en',
      {day:'2-digit',month:'short',year:'numeric'})};
    try{localStorage.setItem('domus_data',JSON.stringify({d:D,s:SRC}))}
    catch(e){say(t.lgBig(''),'er')}
    sel.value='';fillSel();render();

function tables(){
  var h=XH[lang], T={Resumen:[h.Resumen],Hitos:[h.Hitos],Produccion:[h.Produccion],
      Cumplimiento:[h.Cumplimiento],Cadenas:[h.Cadenas],En_curso:[h.En_curso]}, prev=null;
  D.forEach(function(o){
    var m={}; o.ms.forEach(function(x){m[x.k]=x});
    T.Resumen.push([o.id,o.dd,o.nAct,o.nRel,o.done,o.pend,o.neg,
      m.ms1.tf,m.ms2.tf,m.ms3.tf,m.tco.tf,m.co.tf,m.ms2.fc,m.ms3.fc,m.tco.fc,
      o.ch5,o.ch5act,o.dur,o.relDel,o.relAdd,o.cstr,o.actAdd,
      o.prom,o.cump,o.fuera,o.perDone,o.ppc]);
    o.ms.forEach(function(x){
      var d=(x.tf===null||!prev||prev[x.k]===null||prev[x.k]===undefined)
        ?null:Math.round((x.tf-prev[x.k])*100)/100;
      T.Hitos.push([o.id,o.dd,h.ms[x.k],x.code,x.ctr,x.tf,x.fc,d])});
    prev={};o.ms.forEach(function(x){prev[x.k]=x.tf});
    o.realLab.forEach(function(l,i){T.Produccion.push([o.id,o.dd,l,h.sReal,o.real[i]])});
    o.planLab.forEach(function(l,i){T.Produccion.push([o.id,o.dd,l,h.sPlan,o.plan[i]])});
    if(o.ppc!==null)T.Cumplimiento.push([o.id,o.dd,o.prom,o.cump,o.ppc,o.perDone,o.fuera,
      o.perDone?Math.round(1000*o.fuera/o.perDone)/10:null]);
    o.chains.forEach(function(c){T.Cadenas.push([o.id,o.dd,c.tf,c.n,c.code,c.name])});
    o.risk.forEach(function(x){T.En_curso.push([o.id,o.dd,x.code,x.name,x.lf,x.tf])});
  });
  return T;
}

function grab(name,blob){

  var T=tables(), out=[];

    out.push(k);
    T[k].forEach(function(row){

        return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(','))});
    out.push('')});
  grab(XH[lang].file+'.csv',new Blob(['﻿'+out.join('\r\n')],{type:'text/csv;charset=utf-8'}));

/* ═══ Dataset completo: una fila por actividad y por versión ═══
   Solo está disponible cuando los .xer se cargaron en esta sesión: el detalle
   no viaja dentro de la página, se reconstruye al parsear. */
var ST={TK_NotStart:['No iniciada','Not started'],TK_Active:['En curso','In progress'],
        TK_Complete:['Completada','Complete']};
var TT={TT_Task:['Actividad','Task'],TT_Mile:['Hito inicio','Start milestone'],
        TT_FinMile:['Hito fin','Finish milestone'],TT_LOE:['Nivel de esfuerzo','Level of effort'],
        TT_Rsrc:['Dependiente de recurso','Resource dependent'],TT_WBS:['Resumen WBS','WBS summary']};
var PT={PR_FS:'FS',PR_SS:'SS',PR_FF:'FF',PR_SF:'SF'};
function tr(m,k){var e=m[k];return e?e[lang==='es'?0:1]:(k||'')}
function d8(v){return v===null||v===undefined?null:Math.round(v/8*100)/100}

function fullTables(){
  var h=XF[lang], A=[h.Actividades], R=[h.Relaciones], VS=[h.Versiones];
  RAW.forEach(function(V){
    VS.push([V.id,V.dd,V.file,V.acts.length,V.rel.length]);
    V.acts.forEach(function(a){
      A.push([V.id,V.dd,a.code,a.name,a.wbs,tr(ST,a.st),tr(TT,a.type),a.cal,
        d8(a.td),d8(a.rd),a.pc,a.es,a.ee,a.ls,a.lf,a.as_,a.ae,
        a.tf,d8(a.tf),d8(a.ff),a.ct,a.cd,a.fp,a.dpf])});
    V.rel.forEach(function(r){R.push([V.id,V.dd,r.p,r.s,PT[r.t]||r.t,d8(r.lag)])});
  });

  /* matriz de holgura: actividad en filas, versión en columnas */
  var codes=[],seen={},last={};
  RAW.forEach(function(V){V.acts.forEach(function(a){
    if(!seen[a.code]){seen[a.code]=1;codes.push(a.code)} last[a.code]=a})});
  var M=[h.pivHead.concat(RAW.map(function(V){return V.id}))
         .concat([h.pivLast,h.pivAll])];
  codes.forEach(function(c){
    var row=[c,last[c].name,last[c].wbs,tr(ST,last[c].st)], v=[];
    RAW.forEach(function(V){var a=V.byCode[c];var x=a?r2(a.tfd):null;v.push(x);row.push(x)});
    var n=v.length, fin=v[n-1];
    row.push(fin===null||v[n-2]===null||v[n-2]===undefined?null:r2(fin-v[n-2]));
    var first=null;for(var i=0;i<n;i++)if(v[i]!==null){first=v[i];break}
    row.push(fin===null||first===null?null:r2(fin-first));
    M.push(row)});
  M.sort(function(a,b){if(a[0]===h.pivHead[0])return -1;
    var x=a[a.length-2],y=b[b.length-2];
    return (x===null?9e9:x)-(y===null?9e9:y)});

  /* cambios al modelo, actividad por actividad */
  var C=[h.Cambios], L=[h.Logica];
  for(var i=1;i<RAW.length;i++){
    var V=RAW[i], P=RAW[i-1];
    V.acts.forEach(function(a){
      var b=P.byCode[a.code];
      if(!b){C.push([V.id,a.code,a.name,h.cAdd,'','',a.wbs]);return}
      if(b.td!==a.td)C.push([V.id,a.code,a.name,h.cDur,d8(b.td),d8(a.td),a.wbs]);
      if(b.ct!==a.ct)C.push([V.id,a.code,a.name,h.cCt,b.ct,a.ct,a.wbs]);
      if(String(b.cd)!==String(a.cd))C.push([V.id,a.code,a.name,h.cCd,b.cd,a.cd,a.wbs]);
      if(b.st!==a.st)C.push([V.id,a.code,a.name,h.cSt,tr(ST,b.st),tr(ST,a.st),a.wbs]);
    });
    var now={},was={};
    V.rel.forEach(function(r){now[relKey(r)]=r}); P.rel.forEach(function(r){was[relKey(r)]=r});
    Object.keys(was).sort().forEach(function(k){if(!now[k]){var r=was[k];
      L.push([V.id,h.lDel,r.p,r.s,PT[r.t]||r.t,
        (P.byCode[r.p]||{}).name||'',(P.byCode[r.s]||{}).name||''])}});
    Object.keys(now).sort().forEach(function(k){if(!was[k]){var r=now[k];
      L.push([V.id,h.lAdd,r.p,r.s,PT[r.t]||r.t,
        (V.byCode[r.p]||{}).name||'',(V.byCode[r.s]||{}).name||''])}});
  }
  return {Leeme:h.leeme,Diccionario:[h.dicHead].concat(h.dic),Versiones:VS,
          Actividades:A,Holgura_matriz:M,Cambios_actividad:C,Cambios_logica:L,Relaciones:R};
}
